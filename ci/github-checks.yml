# ⚠️ NOT INSTALLED YET. This belongs at `.github/workflows/checks.yml`, and
# it cannot be put there from here. The public GitHub repository is a push
# mirror of a private forge, and the mirror pushes with a personal access
# token that has no `workflow` scope. GitHub refuses any push that creates or
# updates a file under `.github/workflows/`, so committing this to its real
# path stopped the mirror dead: the forge moved on and the public repository
# stayed where it was, which is also where the installer fetches its own
# updates from.
#
# To install it, the mirror's token needs the `workflow` scope. Replace the
# credential on the push mirror, then move this file to
# `.github/workflows/checks.yml` and the next mirror push carries it.
#
# Until then the checks still exist and still run: `nix flake check
# ./configurator` is the whole of what this workflow does.
#
# What a stranger can see being enforced.
#
# Pull requests live on a private forge, so this runs after a merge rather
# than gating one. It is still the thing that makes the repository's promises
# checkable by somebody who does not trust the author: anyone can read what
# ran and what it asserted.
#
# The checks themselves live in the flake (`configurator/flake.nix`), not
# here, so the same command a reader runs locally is the one that runs here.
name: checks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      # One of the checks builds a whole NixOS system with every module
      # turned on, which does not fit beside the runner's preinstalled
      # toolchains.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Catalog integrity, the configurator and its tests, the option
      # documentation, every module with real values, and the leak scan.
      - name: nix flake check
        run: nix flake check ./configurator --print-build-logs

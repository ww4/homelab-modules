<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab installer</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1b; --muted: #5f5e58; --line: #ded9cd;
    --accent: #2a5d8f; --ok: #1d6b3f; --bad: #a32020; --card: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e6e4dd; --muted:#a09e95; --line:#2d2f34; --accent:#8bb8e8; --ok:#79c698; --bad:#f08a8a; --card:#1c1e22; }
  }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif }
  /* The browser's own link blue is near-unreadable against the dark card, so a
     link takes the colour of the text around it and announces itself with an
     underline instead. Links that want their own colour say so after this. */
  a { color:inherit; text-decoration:underline }
  header { border-bottom:1px solid var(--line); background:var(--card) }
  .wrap { max-width:760px; margin:0 auto; padding:1rem 1.1rem }
  h1 { font-size:1.25rem; margin:.1rem 0 .3rem }
  .step { color:var(--muted); font-size:.85rem }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:.6rem; overflow:hidden }
  .bar i { display:block; height:100%; background:var(--accent) }
  .intro { color:var(--muted); margin:.9rem 0 1.2rem }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.9rem 1rem; margin:.7rem 0 }
  .card h3 { margin:.1rem 0 .4rem; font-size:1rem }
  .row { display:flex; gap:.7rem; align-items:baseline; flex-wrap:wrap; margin:.55rem 0 }
  .row label { flex:0 0 11rem; font-weight:600 }
  .row .help { flex:1 1 100%; color:var(--muted); font-size:.85rem; margin-top:-.3rem }
  input[type=text], input[type=password], select, textarea {
    flex:1 1 14rem; min-width:0; font:inherit; padding:.5rem .6rem; color:var(--fg);
    background:var(--bg); border:1px solid var(--line); border-radius:6px;
  }
  textarea { width:100%; min-height:4.2rem; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px }
  button { font:inherit; padding:.5rem .9rem; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button.danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600 }
  button:disabled { opacity:.5; cursor:default }
  .choice { display:flex; gap:.7rem; padding:.6rem; border:1px solid var(--line); border-radius:6px; margin:.4rem 0; cursor:pointer; align-items:flex-start }
  .choice.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent) }
  .choice b { display:block }
  .choice .mem { font-variant-numeric:tabular-nums; font-weight:600 }
  .fits { color:var(--ok) } .short { color:var(--bad) }
  .muted { color:var(--muted) } .ok { color:var(--ok) } .bad { color:var(--bad) }
  pre { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:.7rem; overflow:auto; max-height:26rem; font-size:.8rem; line-height:1.35 }
  footer { position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); margin-top:1.2rem }
  footer .wrap { display:flex; gap:.7rem; align-items:center; padding:.8rem 1.1rem }
  #status { min-height:1.4rem; font-size:.9rem }
  ul.keys { list-style:none; padding:0; margin:.4rem 0 }
  ul.keys li { display:flex; gap:.6rem; align-items:center; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; margin:.25rem 0 }
  .erase { color:var(--bad); font-weight:600; font-family:ui-monospace,Menlo,Consolas,monospace }
  .mods { max-height:22rem; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:.4rem }
  .mods label { display:flex; gap:.5rem; align-items:flex-start; padding:.25rem; font-size:.9rem }
  .mods label span { color:var(--muted) }
  dl { display:grid; grid-template-columns:8rem 1fr; gap:.3rem .8rem; margin:.3rem 0 }
  dt { font-weight:600 } dd { margin:0 }
  .colophon { border-top:1px solid var(--line); margin-top:1.5rem; padding:.8rem 0 2rem; color:var(--muted); font-size:.8rem;
              display:flex; gap:.6rem 1rem; flex-wrap:wrap; align-items:center }
  .colophon a { color:var(--muted) }
  .colophon .sep { opacity:.5 }
  .gear { margin-left:auto; font-size:1.1rem; text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:.15rem .5rem }
  .warn { border-color:var(--bad) }
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title">Homelab installer</h1>
  <div class="step" id="stepline"></div>
  <div class="bar"><i id="progress" style="width:0"></i></div>
</div></header>

<main class="wrap">
  <p class="intro" id="intro"></p>
  <div id="screen"></div>
  <div class="colophon" id="colophon"></div>
</main>

<footer><div class="wrap">
  <button id="back">Back</button>
  <button id="go" class="primary">Continue</button>
  <span id="status"></span>
</div></footer>

<script src="/nacl.js"></script>
<script>
/* The code lives in the URL and nowhere else: entering it is a redirect, so
   this page always starts knowing whether it has one. */
const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
let state = null, needCode = false;

/* Building a screen and merging a screen are the same operation here: `el`
   makes a detached node and `apply` writes the properties, and on the next
   poll `apply` runs again against the live node with the props it was given
   last time. Writing a value that is already there is not free — it collapses
   a text selection and can move a caret — so nothing is written unless it
   differs from what this code last asked for.
   `key` is identity for the patcher rather than a DOM property: it is what
   lets one row be removed from a list without every row below it being
   rewritten. */
const el = (t, props = {}, kids = []) => {
  const n = document.createElement(t);
  apply(n, props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

function apply(node, props) {
  const was = node.__props || {};
  const held = document.activeElement;
  for (const k in props) {
    const v = props[k];
    if (k === "key") continue;
    // Handlers are replaced every time: a closure kept from an earlier render
    // answers out of the state that render was looking at.
    if (typeof v === "function") { node[k] = v; continue; }
    if (was[k] === v) continue;
    // Writing textContent throws the text node away and makes another one,
    // which takes any selection inside it with it; writing the existing text
    // node keeps the node, so only the characters change.
    if (k === "textContent" && node.firstChild && node.firstChild.nodeType === 3 && !node.firstChild.nextSibling) {
      const t = node.firstChild;
      // The install log only ever grows: appending to the text keeps a
      // selection made in the lines already there, which is where someone
      // copying an error message is working.
      if (v !== t.nodeValue) { if (v.startsWith(t.nodeValue)) t.appendData(v.slice(t.nodeValue.length)); else t.nodeValue = v; }
      continue;
    }
    // What the reader is holding is theirs: never overwrite the contents of
    // the control they are typing in, or of a dropdown they have open.
    if ((k === "value" || k === "checked" || k === "selected") && (node === held || node.parentNode === held)) continue;
    node[k] = v;
  }
  // A property that was set last time and is not set now has to be undone, or
  // a row that stops being disabled stays disabled forever.
  for (const k in was) {
    if (k in props) continue;
    node[k] = typeof was[k] === "function" ? null : typeof was[k] === "boolean" ? false : "";
  }
  node.__props = props;
  node.__key = props.key;
}

/* Merge a freshly built child list into a live parent. Matching is by key
   where there is one and by position otherwise; a matched node is patched in
   place and never replaced, so the selection, the caret and the scroll
   position inside it all survive. */
function patchChildren(parent, kids) {
  const want = [].concat(kids).map((k) => (typeof k === "string" ? document.createTextNode(k) : k));
  const live = Array.from(parent.childNodes);
  const keyed = new Map();
  for (const n of live) if (n.__key != null) keyed.set(n.__key, n);
  const used = new Set();
  const order = [];
  let at = 0;
  for (const w of want) {
    let hit = null;
    if (w.__key != null) {
      hit = keyed.get(w.__key) || null;
      if (hit && used.has(hit)) hit = null;
    } else {
      // Unkeyed siblings are a fixed structure, so they line up one for one;
      // keyed neighbours are skipped because they belong to the lookup above.
      while (at < live.length) {
        const c = live[at++];
        if (c.__key != null || used.has(c)) continue;
        if (c.nodeName === w.nodeName) hit = c;
        break;
      }
    }
    if (hit && hit.nodeName === w.nodeName) { patchNode(hit, w); used.add(hit); order.push(hit); }
    else order.push(w);
  }
  // Walk the wanted order against the live order, moving only what is out of
  // place; everything left over the end was removed.
  let ref = parent.firstChild;
  for (const n of order) {
    if (ref === n) { ref = ref.nextSibling; continue; }
    parent.insertBefore(n, ref);
  }
  while (ref) { const next = ref.nextSibling; parent.removeChild(ref); ref = next; }
}

function patchNode(live, want) {
  if (live.nodeType === 3) { if (live.nodeValue !== want.nodeValue) live.nodeValue = want.nodeValue; return; }
  apply(live, want.__props || {});
  patchChildren(live, Array.from(want.childNodes));   // snapshot: the merge empties want as it goes
}

/* The box holds one screen at a time. Moving to another screen is a real
   change of subject and builds fresh; staying on the same screen patches it.
   Returns true when it built, which is the only moment focus may be taken. */
let shown = "";
function show(id, kids) {
  const box = document.getElementById("screen");
  const fresh = shown !== id;
  if (fresh) { shown = id; box.replaceChildren(); }
  patchChildren(box, kids);
  return fresh;
}

/* The furniture outside the screen box is written the same way: compare first,
   write only on a difference. */
const setText = (id, text) => { const n = document.getElementById(id); if (n.textContent !== text) n.textContent = text; };
const setProp = (node, k, v) => { if (node[k] !== v) node[k] = v; };
const setDisplay = (node, v) => { if (node.style.display !== v) node.style.display = v; };

/* ── keeping secrets off the wire ──────────────────────────────────────────
   This page is served over plain HTTP, so a Cloudflare token typed into the
   form would otherwise be readable by anyone watching the network. A
   certificate would fix that and cost every reader a browser warning to click
   through, which is a bad habit to teach somebody installing their first
   server. So secret values are sealed to a key this installer made when it
   started, and only the ciphertext is posted.

   The browser will not lend us its own cryptography here: on a plain-HTTP
   page `crypto.subtle` is undefined, because the page is not a secure
   context. `crypto.getRandomValues` does work, and TweetNaCl uses it. */
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
const unhex = (h) => Uint8Array.from(h.match(/../g) || [], (x) => parseInt(x, 16));

async function sealValue(v) {
  const pk = state && state.sealing && state.sealing.public_key;
  if (!pk) throw new Error("this installer offered no key to seal to");
  if (!window.nacl) throw new Error("the page's cryptography did not load");
  const eph = nacl.box.keyPair();
  const nonce = nacl.randomBytes(24);
  const ct = nacl.box(new TextEncoder().encode(v), nonce, unhex(pk), eph.secretKey);
  if (!ct) throw new Error("sealing failed");
  return { epk: hex(eph.publicKey), nonce: hex(nonce), ct: hex(ct) };
}

/* An action carrying a value. A secret one goes sealed; if sealing is somehow
   impossible the value is still sent, because an installer that refuses a
   token is worse than one that warns, and the machine records that it arrived
   readable and says so on the Review screen. */
async function withValue(base, v, secret) {
  if (secret && v) {
    try {
      return { ...base, sealed: await sealValue(v) };
    } catch (e) {
      setText("status", "could not seal this value, so it crossed the network readable: " + e.message);
      document.getElementById("status").className = "bad";
    }
  }
  return { ...base, value: v };
}

async function call(action) {
  const r = await fetch(action ? "/api/action?code=" + code : "/api/state?code=" + code, {
    method: action ? "POST" : "GET",
    headers: action ? { "Content-Type": "application/json" } : {},
    body: action ? JSON.stringify(action) : undefined,
  });
  if (r.status === 403) { askCode(); return; }
  state = await r.json();            // 409 answers with the state too, saying who holds it
  noticeVersion(state);
  render();
}

/* Asking for the code is a dead end until it is given: nothing here polls,
   nothing re-renders, so the box keeps the focus and the keystrokes. */
function askCode() {
  if (needCode) return;
  needCode = true;
  const input = el("input", { type: "text", placeholder: "ACDEFGHJ", autocapitalize: "characters", autocomplete: "off", spellcheck: false, size: 12, maxLength: 8 });
  const submit = () => {
    const v = input.value.trim().toUpperCase();
    if (!v) return input.focus();
    const u = new URL(location.href);
    u.searchParams.set("code", v);
    location.replace(u.toString());   // reload with the code: the form starts at step 1
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  document.getElementById("title").textContent = "Homelab installer";
  document.getElementById("intro").textContent = "";
  shown = "__code";                 // the box is handed to the code form; a later render must rebuild
  document.getElementById("colophon").replaceChildren();
  document.getElementById("back").style.display = "none";
  document.getElementById("go").style.display = "none";
  document.getElementById("status").textContent = code ? "that code did not match the one on the machine's screen" : "";
  document.getElementById("status").className = code ? "bad" : "";
  document.getElementById("screen").replaceChildren(
    el("div", { className: "card" }, [
      el("h3", { textContent: "Enter the code from the machine's screen" }),
      el("p", { className: "muted", textContent: "The installer shows eight characters next to this address, from an alphabet with no look-alikes. It stops anyone else on your network from filling in your install." }),
      el("div", { className: "row" }, [input, el("button", { className: "primary", textContent: "Continue", onclick: submit })]),
    ]));
  input.focus();
}

/* one label + control line */
function row(label, control, help, key) {
  const kids = [el("label", { textContent: label }), control];
  if (help) kids.push(el("div", { className: "help", textContent: help }));
  return el("div", { className: "row", key }, kids);
}

const DOTS = "\u2022".repeat(10);

function textField(f, send) {
  if (f.choices && f.choices.length) return choiceField(f, send);
  // A saved password keeps a row of dots until the reader types a new one,
  // and an untouched field is never sent back.
  const saved = f.masked && f.set;
  const input = el("input", {
    key: "in",
    type: f.masked ? "password" : "text",
    value: f.masked ? (saved ? DOTS : "") : (f.value || ""),
    oninput: (e) => { if (e.target.dataset.fresh !== "1" && e.target.value.includes("\u2022")) e.target.value = ""; e.target.dataset.fresh = "1"; },
    onblur: (e) => {
      if (saved && e.target.dataset.fresh !== "1") return;   // untouched: leave the saved value alone
      send(e.target.value);
    },
    onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); },
  });
  return row(f.label, input, f.help, f.key);
}

function choiceField(f, send) {
  const known = f.choices.some((c) => c.value === f.value);
  // The handler finds the box by id rather than closing over it: the node this
  // render built is thrown away once its properties have been merged into the
  // live one, and a closure over it would be writing to nothing.
  const otherId = "other-" + f.key;
  const sel = el("select", {
    key: "sel",
    onchange: (e) => {
      const box = document.getElementById(otherId);
      if (e.target.value === "__other") { box.hidden = false; box.focus(); return; }
      box.hidden = true;
      send(e.target.value);
    },
  });
  for (const c of f.choices) sel.append(el("option", { key: c.value, value: c.value, textContent: c.label, selected: c.value === f.value }));
  if (f.other_ok) sel.append(el("option", { key: "__other", value: "__other", textContent: "Other (type it)", selected: !known && !!f.value }));
  const other = el("input", {
    key: "other", id: otherId, type: "text", value: known ? "" : (f.value || ""),
    placeholder: "Region/City", hidden: known || !f.value,
    onblur: (e) => { if (e.target.value.trim()) send(e.target.value.trim()); },
    onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); },
  });
  const wrap = el("div", { style: "flex:1 1 14rem; display:flex; gap:.5rem; flex-wrap:wrap" }, [sel, other]);
  return row(f.label, wrap, f.help, f.key);
}

let showingUpdate = false, bootVersion = null, updating = false;

/* Name, address, version, where this came from — and the gear, which is the
   only way to replace the installer with a newer one mid-session. */
function colophon(s) {
  const f = document.getElementById("colophon");
  const site = "https://ww4.github.io/imperfect-homelab";
  patchChildren(f, [
    el("b", { key: "name", textContent: "Imperfect Homelab" }),
    el("span", { key: "s1", className: "sep", textContent: "·" }),
    el("span", { key: "ver", textContent: "installer " + (s.version || "dirty").slice(0, 7) }),
    el("span", { key: "s2", className: "sep", textContent: "·" }),
    el("span", { key: "addr", textContent: s.machine.address ? s.machine.address + ":" + s.web.port : "no address" }),
    el("span", { key: "s3", className: "sep", textContent: "·" }),
    el("a", { key: "guide", href: site, target: "_blank", rel: "noreferrer", textContent: "guide" }),
    el("span", { key: "s4", className: "sep", textContent: "·" }),
    el("a", { key: "gpl", href: "https://www.gnu.org/licenses/gpl-3.0.html", target: "_blank", rel: "noreferrer", textContent: "GPL-3.0" }),
    el("a", {
      key: "gear",
      className: "gear" + (s.update && s.update.newer ? " warn" : ""),
      href: "#", title: "Installer updates",
      textContent: s.update && s.update.newer ? "\u2699 update" : "\u2699",
      onclick: (e) => { e.preventDefault(); showingUpdate = !showingUpdate; render(); },
    }),
  ]);
}

function renderUpdate(s) {
  const u = s.update;
  if (updating || (u && u.restarting)) {
    updating = true;
    setText("title", "Updating the installer");
    setText("intro", "");
    setDisplay(document.getElementById("back"), "none");
    show("__updating", [el("div", { className: "card" }, [
      el("h3", { textContent: "Fetching and restarting" }),
      el("p", { textContent: "The installer is being replaced with the newer one. This page reconnects by itself and comes back at the first screen, with your answers still in it." }),
      el("p", { className: "muted", textContent: "A minute at most. Leave this page open." }),
    ])]);
    return;
  }
  setText("title", "Installer updates");
  setText("intro", "This installer updates itself from the project's binary cache. Your answers and any credentials you have saved are kept; the installer restarts and comes back at the first screen with everything filled in.");
  setDisplay(document.getElementById("back"), "");
  document.getElementById("back").onclick = () => { showingUpdate = false; render(); };
  setDisplay(document.getElementById("go"), "none");
  // Keys here, on children that come and go: without them the trust card would
  // be matched against whatever sits in its place when it is absent.
  show("__update", [el("div", { className: "card" }, [
    el("h3", { key: "head", textContent: "This installer" }),
    el("dl", { key: "versions" }, [
      el("dt", { textContent: "Version" }), el("dd", { textContent: (s.version || "dirty") }),
      el("dt", { textContent: "Newest" }), el("dd", { textContent: u ? u.newest.slice(0, 7) + (u.newer ? " — newer than this one" : " — the same") : "not checked yet" }),
    ]),
    ...(u && u.pending ? [el("p", { key: "pending", className: "muted", textContent: "A newer change (" + u.pending + ") has landed but is not in the cache yet. It is published a few minutes after it lands; check again shortly." })] : []),
    // Say what is about to replace this program, before it does. "It is
    // signed" means nothing without naming the key it is signed by.
    ...(u && u.newer ? [el("div", { key: "trust", className: "card" }, [
      el("h3", { key: "head", textContent: "What this will trust" }),
      el("dl", { key: "facts" }, [
        el("dt", { textContent: "Commit" }), el("dd", { textContent: u.newest }),
        el("dt", { textContent: "Built as" }), el("dd", { textContent: u.store_path || "unknown" }),
        el("dt", { textContent: "Published" }), el("dd", { textContent: u.published || "unknown" }),
        el("dt", { textContent: "Signed by" }), el("dd", { textContent: u.key_name }),
        el("dt", { textContent: "This machine trusts" }), el("dd", { textContent: (u.trusted_keys && u.trusted_keys.length) ? u.trusted_keys.join("  ") : "could not be read, so nothing can be said about what will be accepted" }),
      ]),
      el("p", { key: "how", className: "muted", textContent: "That exact revision is built, not whatever the branch points at now, and the result must be the store path above or the update stops. Nix checks the signature against the keys listed here and refuses a build none of them signed." }),
      ...((u.trusted_keys || []).some(k => k.startsWith(u.key_name + ":")) ? [] : [el("p", { key: "untrusted", className: "bad", textContent: "This machine does not list the project's key among the ones it trusts, so an update cannot be taken from the cache. It would have to be built here from source, which takes far longer. The installer image carries the key; a machine configured by hand may not." })]),
    ])] : []),
    el("div", { key: "actions", className: "row" }, [
      el("button", { key: "check", textContent: "Check for updates", onclick: () => call({ do: "check_update" }) }),
      el("button", {
        key: "apply",
        className: "primary", textContent: "Update and restart", disabled: !(u && u.newer) || s.step === "install",
        onclick: () => call({ do: "apply_update" }),
      }),
    ]),
    el("p", { key: "note", className: "muted", textContent: s.step === "install" ? "Not while the install is running." : "Updating fetches the newer installer (about a minute) and hands this session over to it. The page reconnects by itself." }),
  ])]);
}

/* The page polls so the console and the browser stay in step. A poll used to
   rebuild the screen, which threw away whatever the reader was holding — a
   half-made text selection, a caret, an open dropdown — so it had to be
   suppressed whenever anything was in use. Now every poll renders, and the new
   tree is merged into the live one node by node, so a poll that changes one
   number touches one number and leaves the rest of the page exactly as it was.
   Nothing here depends on the state having changed. */
function render() {
  if (!state) return;
  const s = state;
  setText("title", s.title);
  setText("stepline", `step ${s.index} of ${s.of}`);
  const bar = document.getElementById("progress"), width = (100 * s.index / s.of) + "%";
  if (bar.style.width !== width) bar.style.width = width;
  setText("intro", s.intro);
  setText("status", s.status ? s.status.message : "");
  setProp(document.getElementById("status"), "className", s.status && s.status.error ? "bad" : "ok");

  const back = document.getElementById("back"), go = document.getElementById("go");
  setDisplay(back, ["welcome", "install", "done"].includes(s.step) ? "none" : "");
  back.onclick = () => call({ do: "back" });
  setProp(go, "textContent", s.step === "review" ? (s.machine.live_usb ? "Install" : "Write the configuration")
    : s.step === "install" ? "working..." : s.step === "done" ? "Finished" : "Continue");
  setProp(go, "className", s.step === "review" ? "danger" : "primary");
  setProp(go, "disabled", s.step === "install" || s.step === "done");
  go.onclick = () => call({ do: "continue" });

  colophon(s);
  // One browser drives. A second one is told, and may take over.
  if (s.web && s.web.in_control === false && !showingUpdate) {
    setDisplay(back, "none");
    setDisplay(go, "none");
    show("__locked", [el("div", { className: "card" }, [
      el("h3", { textContent: "Someone else is filling this in" }),
      el("p", { textContent: `A browser at ${s.web.controller} is using this installer. Two people editing the same answers would overwrite each other, so only one drives at a time.` }),
      el("p", { className: "muted", textContent: "You can watch from here, or take over — the other browser will be told it lost the form." }),
      el("div", { className: "row" }, [el("button", { className: "danger", textContent: "Take over", onclick: () => call({ do: "take_over" }) })]),
    ])]);
    return;
  }
  setDisplay(go, "");
  if (showingUpdate) { renderUpdate(s); return; }
  // Install was pressed here, and the machine's own screen is asking whether
  // to go ahead. Nothing is erased until somebody presses a key there.
  //
  // ⚠️ THE ANSWER NEVER TRAVELS. An earlier version had the machine show a
  // six-digit number to type in here, which sent it straight back over the
  // same plain HTTP the number existed to protect, and a wrong guess only
  // cost another request. A keypress on the machine cannot be intercepted,
  // replayed or guessed from the network at all.
  if (s.awaiting_console) {
    setDisplay(go, "none");
    setDisplay(back, "none");
    show("__console", [el("div", { className: "card" }, [
      el("h3", { textContent: "Go to the machine and say yes" }),
      el("p", { textContent: "Its own screen is listing the disks it is about to erase and waiting for an answer. Press Y there to install, or Escape to refuse." }),
      el("p", { className: "muted", textContent: "There is nothing to type here. The answer is a keypress on the machine, so nothing about it crosses the network and nobody can approve an install without standing in front of it." }),
      el("p", { className: "muted", textContent: "This page comes back by itself once the install starts." }),
    ])]);
    return;
  }
  show(s.step, (screens[s.step] || (() => []))(s));
}

/* Every repeated thing carries a key — a module's name, a disk's id, a
   secret's option — so that adding or removing one patches that row alone
   instead of shifting the contents of every row after it. */
const screens = {
  welcome: (s) => {
    const m = s.machine;
    const net = !m.address ? "waiting for a network address" : `${m.address}${m.internet === false ? " · internet NOT reachable yet" : m.internet ? " · internet reachable" : ""}`;
    return [el("div", { className: "card" }, [
      el("h3", { textContent: "This machine" }),
      el("dl", {}, [
        el("dt", { textContent: "Memory" }), el("dd", { textContent: m.ram_mib ? (m.ram_mib / 1024).toFixed(1) + " GB" : "unknown" }),
        el("dt", { textContent: "Disks" }), el("dd", { textContent: m.disks + " available to install on" }),
        el("dt", { textContent: "Network" }), el("dd", { textContent: net }),
      ]),
      el("p", { className: "muted", textContent: "You are filling this in from another computer; the machine's own screen shows the same answers as you go." }),
    ])];
  },

  kit: (s) => s.kits.map((k, i) =>
    el("div", { key: k.name, className: "choice" + (k.chosen ? " on" : ""), onclick: () => call({ do: "set_kit", index: i }) }, [
      el("div", { className: "mem " + (k.fits ? "fits" : "short"), textContent: "~" + k.need_gb + " GB" }),
      el("div", {}, [el("b", { textContent: k.name }), el("span", { className: "muted", textContent: k.blurb })]),
    ])),

  storage: (s) => {
    if (!s.disks.length) return [textField(s.disk_fallback, (v) => call({ do: "set_disk_path", value: v }))];
    return s.disks.map((d, i) => {
      const sel = el("select", { key: "role", onchange: (e) => call({ do: "set_disk", index: i, role: e.target.value }) });
      for (const [v, t] of [["unused", "not used"], ["system", "SYSTEM — the operating system (erased)"], ["data", "data — storage for your files (erased)"], ["parity", "parity — protects the data disks"]]) {
        sel.append(el("option", { key: v, value: v, textContent: t, selected: d.role === v }));
      }
      return el("div", { key: d.id || d.kernel, className: "card" }, [
        el("div", { className: "row" }, [el("label", { textContent: `${d.kernel} · ${d.size}` }), sel]),
        el("div", { className: "muted", style: "font-size:.8rem", textContent: `${d.model || "disk"} · ${d.id}` }),
      ]);
    });
  },

  profile: (s) => s.profile.map((f) => textField(f, async (v) => call(await withValue({ do: "set_profile", key: f.key }, v, f.masked)))),

  ssh: (s) => {
    // Both boxes are read by id when the button is pressed: the nodes this
    // call builds are merged into the live ones and then dropped, so a handler
    // holding on to one would be reading an element nobody can see.
    const keys = el("ul", { className: "keys" }, s.ssh.keys.map((k, i) =>
      el("li", { key: k.summary }, [el("span", { textContent: k.summary }), el("button", { textContent: "Remove", onclick: () => call({ do: "remove_key", index: i }) })])));
    return [
      el("div", { key: "github", className: "card" }, [
        el("h3", { textContent: "Import from GitHub" }),
        el("div", { className: "row" }, [
          el("input", { key: "user", id: "gh-user", type: "text", placeholder: "github username" }),
          el("button", { key: "import", textContent: "Import", onclick: () => call({ do: "github", user: document.getElementById("gh-user").value }) }),
        ]),
        el("div", { className: "help", textContent: "The public keys on that GitHub account are added to the list. Nothing already in the list is removed." }),
      ]),
      el("div", { key: "paste", className: "card" }, [
        el("h3", { textContent: "Or paste a public key" }),
        el("textarea", { key: "text", id: "key-paste", placeholder: "ssh-ed25519 AAAA... you@laptop" }),
        el("div", { className: "row" }, [el("button", { textContent: "Add key", onclick: () => call({ do: "add_key", text: document.getElementById("key-paste").value }) })]),
      ]),
      el("div", { key: "list", className: "card" }, [el("h3", { textContent: `Keys that may log in (${s.ssh.keys.length})` }), keys]),
    ];
  },

  domain: (s) => {
    const out = s.domain.map((f) => textField(f, async (v) => call(await withValue({ do: "set_domain", key: f.key }, v, f.masked))));
    for (const sec of s.secrets) {
      const card = el("div", { key: sec.option, className: "card" }, [
        el("h3", { key: "title", textContent: sec.title }),
        el("p", { key: "steps", className: "muted", style: "white-space:pre-wrap; font-size:.88rem", textContent: sec.steps }),
        ...(sec.walkthrough ? [el("p", { key: "walk" }, [
          el("a", { href: sec.walkthrough, target: "_blank", rel: "noreferrer", textContent: "Step-by-step walkthrough with screenshots" }),
          el("span", { className: "muted", textContent: " (opens the guide site in a new tab)" }),
        ])] : []),
        // The same fingerprint is on the machine's own screen. Comparing them
        // is what catches somebody sitting between this page and the machine.
        ...(s.sealing ? [el("p", { key: "seal", className: "muted" }, [
          el("span", { textContent: "Sealed to this machine before it leaves your browser. Key " }),
          el("b", { textContent: s.sealing.fingerprint }),
          el("span", { textContent: ", which the machine's own screen shows too." }),
        ])] : []),
      ]);
      if (sec.path_only) {
        card.append(row("File on the machine", el("input", {
          key: "path", type: "text", value: sec.path || "",
          onblur: (e) => call({ do: "set_secret", option: sec.option, var: "__path", value: e.target.value }),
        }), null, "__path"));
      } else {
        for (const f of sec.fields) {
          card.append(textField(f, async (v) => call(await withValue({ do: "set_secret", option: sec.option, var: f.key }, v, f.masked))));
        }
      }
      card.append(el("div", { key: "actions", className: "row" }, [
        el("button", { key: "save", className: "primary", textContent: "Save", onclick: () => call({ do: "save_secret", option: sec.option }) }),
        el("button", { key: "skip", textContent: "Skip for now", onclick: () => call({ do: "skip_secret", option: sec.option }) }),
        el("span", { key: "state", className: sec.skipped || (sec.verified && !sec.verified.ok) ? "bad" : sec.filled ? "ok" : "muted", textContent: sec.state }),
      ]));
      out.push(card);
    }
    return out;
  },

  extras: (s) => {
    const out = s.values.map((v) => textField({ key: v.name, label: v.name, help: v.description, value: v.value, masked: false },
      (val) => call({ do: "set_value", name: v.name, value: val })));
    const list = el("div", { className: "mods" }, s.modules.map((m) =>
      el("label", { key: m.name }, [
        el("input", { type: "checkbox", checked: m.chosen, disabled: m.locked, onchange: () => call({ do: "toggle_module", name: m.name }) }),
        el("div", {}, [el("b", { textContent: m.name + (m.locked ? " (always on)" : "") }), el("span", { textContent: " " + m.description })]),
      ])));
    out.push(el("div", { key: "modules", className: "card" }, [el("h3", { textContent: "Modules" }), el("p", { className: s.memory.short ? "bad" : "ok", textContent: s.memory.verdict }), list]));
    return out;
  },

  review: (s) => {
    const r = s.review;
    const d = el("dl", {}, [
      el("dt", { textContent: "Machine" }), el("dd", { textContent: `${r.host} · ${r.time_zone} · admin ${r.admin}${r.minted_password ? " · password minted into FIRST-LOGIN.md" : ""}` }),
      el("dt", { textContent: "Kit" }), el("dd", { textContent: `${r.kit} · ${r.modules.length} modules` }),
      el("dt", { textContent: "Memory" }), el("dd", { className: s.memory.short ? "bad" : "ok", textContent: s.memory.verdict }),
      el("dt", { textContent: "SSH keys" }), el("dd", { textContent: r.keys.length ? r.keys.join("; ") : "none (console login only)" }),
      ...(s.cleartext_secret_seen ? [el("dt", { textContent: "Warning" }),
        el("dd", { className: "bad", textContent: "a secret reached this machine unsealed, so it crossed the network readable by anyone watching. Change it after the install if the network is not yours." })] : []),
      el("dt", { textContent: "Domain" }), el("dd", { textContent: r.domain || "—" }),
    ]);
    const cards = [el("div", { key: "plan", className: "card" }, [el("h3", { textContent: "What will be installed" }), d,
      el("div", { className: "muted", style: "font-size:.85rem", textContent: r.modules.join(" ") })])];
    if (r.skipped_secrets.length) {
      cards.push(el("div", { key: "skipped", className: "card" }, [el("h3", { textContent: "Skipped credentials" }),
        el("p", { className: "bad", textContent: r.skipped_secrets.join(", ") + " — what depends on these will not work until you set them on the machine and rebuild." })]));
    }
    cards.push(el("div", { key: "erased", className: "card" }, [el("h3", { textContent: "These disks are erased" }),
      el("p", { className: "erase", textContent: r.erased.join("   ") || "—" })]));
    return cards;
  },

  install: (s) => [el("pre", { key: "log", id: "log", textContent: s.install.lines.slice(-400).join("\n") })],

  done: (s) => [el("pre", { key: "report", textContent: s.done.report.join("\n") })],
};

/* The relaunched installer answers on the same port with the same code: when
   the version changes, the update is done. */
function noticeVersion(s) {
  if (!s || !s.version) return;
  if (bootVersion === null) { bootVersion = s.version; return; }
  if (s.version !== bootVersion) {
    bootVersion = s.version;
    updating = false;
    showingUpdate = false;
    shown = "";                     // a different program answered: build the screen fresh
    s.status = { message: "updated to installer " + s.version.slice(0, 7) + " — your answers came with it", error: false };
  }
}

async function tick() {
  if (!code || needCode) return;   // the code screen is not synced with anything
  // Polling no longer stops for a control in use: a poll patches, so the rest
  // of the page can go on updating while someone is typing in one field.
  try { await call(null); } catch (e) { /* restarting, or the machine is rebooting */ }
  if (state && state.step === "install") {
    const log = document.getElementById("log");
    if (log) log.scrollTop = log.scrollHeight;
  }
}
if (code) call(null); else askCode();
setInterval(tick, 1500);
</script>
</body>
</html>

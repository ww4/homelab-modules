[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agent"
version = "0.1.0"
description = "Search Facebook Marketplace against a written brief, check the facts, and rank what's worth a look."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pillow>=10",  # watch-page thumbnails
]

[project.optional-dependencies]
# Only needed for MARKET_AGENT_JUDGE=api (the default judge shells out to the claude CLI).
api = ["anthropic>=0.70"]
test = ["pytest>=8"]

[project.scripts]
market-agent = "market_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_agent = ["data/*.toml", "data/*.json", "examples/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

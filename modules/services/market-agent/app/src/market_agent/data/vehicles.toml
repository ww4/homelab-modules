# ================================================================ issues
[[issues]]
make = "Honda"
model = "CR-V"
years = [2007, 2011]
kind = "recall"
title = "Rear frame corrosion recall (NHTSA 23V-228)"
chip = "Frame-rust recall"
detail = "In salt-belt states, rust inside the rear frame can let the rear trailing arm separate. Dealer inspects; adds a brace, repairs the frame, or buys the vehicle back. Free."
ask = "Has recall 23V-228 been done? Get the VIN and check Honda's recall lookup; look at the rear frame on a lift."
source = "https://hondanews.com/en-US/honda-corporate/releases/release-f61ab7d13cb83fb181b8bc22df059449-2007-2011-honda-cr-v-rear-frame-corrosion-recall"
verified = true

[[issues]]
make = "Honda"
model = "CR-V"
years = [2007, 2011]
kind = "bulletin"
title = "A/C compressor clutch wear (Honda SB 12-072)"
chip = "A/C clutch"
detail = "Clutch wears out: A/C blows warm or makes noise from the compressor. The old 7-year warranty extension has long expired."
ask = "Does the A/C blow cold at idle and on the road? Any compressor noise?"
source = "https://www.carcomplaints.com/Honda/CR-V/2009/tsb/tsb-sb-12-072.shtml"
verified = true

[[issues]]
make = "Toyota"
model = "RAV4"
years = [2006, 2012]
drivetrain = "4wd"
kind = "bulletin"
title = "Rear differential coupling growl on 4WD (Toyota T-SB-0080-13)"
chip = "Rear coupling"
detail = "Contaminated front bearing in the rear coupling causes a growl while driving. The warranty enhancement ended April 2017."
ask = "Any growl or hum from the rear while driving? Has the rear coupling been replaced?"
source = "https://www.cars.com/articles/2006-2012-toyota-rav4-coupling-issue-1420688743307"
verified = true

[[issues]]
make = "Subaru"
model = "Forester"
years = [2011, 2014]
kind = "bulletin"
title = "Excessive oil consumption, 2.5L FB25 (Subaru TSB 02-157-14R)"
chip = "Oil consumption"
detail = "Faulty short block; Subaru's fix was a short-block replacement (earlier: pistons and rings)."
ask = "How much oil does it use between changes? Has Subaru replaced the short block or rings?"
source = "https://www.cars.com/articles/2011-15-subaru-oil-consumption-update-1420683845519"
verified = true

[[issues]]
make = "Subaru"
model = "Outback"
years = [2013, 2014]
kind = "bulletin"
title = "Excessive oil consumption, 2.5L FB25 (Subaru TSB 02-157-14R)"
chip = "Oil consumption"
detail = "Same bulletin as the Forester; later revisions cover Outback. Confirm VIN applicability against the current revision."
ask = "How much oil does it use between changes? Any Subaru engine work under 02-157-14R?"
source = "https://static.nhtsa.gov/odi/tsbs/2016/MC-10120985-9999.pdf"
verified = true


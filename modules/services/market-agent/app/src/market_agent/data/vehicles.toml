# Model-year facts the judge is allowed to use.
#
# The judge is told to make NO model-specific claim that isn't in this file,
# in NHTSA's recall data, or in a VIN decode. That rule exists because a
# from-memory "ask about head gaskets" was wrong for a 2011 Forester (it has
# the FB25 engine; the real issue is oil consumption).
#
# generations: drivetrain and transmission type by year range. These are
#   spec-sheet facts; check a generation against the maker's spec page before
#   adding it. transmission_type: conventional | cvt | depends-on-engine.
#   drivetrain: awd-standard | fwd-or-awd | fwd-or-4wd | rwd-or-4wd | 4wd-standard | fwd-only
# issues: verified = true only with a source URL that was actually read.
#   `chip` is the short label shown as a colored tag on every listing of that
#   model; the judge is told not to restate these, only to use listing evidence.
#   Unverified entries reach the judge labelled as unverified and are phrased
#   as questions for the seller, never as findings.


  // note underneath. The whole left quarter now routes here (see drawerZone),
  // and while the drawer is open ANY leftward swipe closes it, from anywhere —
  // you should not have to find the drawer again to dismiss it.
  (function(){
    if (!("ontouchstart" in window)) return;
    var W = function(){ return Math.min(300, window.innerWidth * 0.84); };
    var x0 = 0, y0 = 0, mode = null, decided = false;   // mode: "open" | "close"

    function isOpen(){ return el.drawer.classList.contains("open"); }
    function track(dx){
      el.drawer.style.transition = "none";
      var off = mode === "open" ? Math.min(dx, W()) - W() : Math.max(-W(), Math.min(0, dx));
      el.drawer.style.transform = "translateX(" + off + "px)";
      el.drawerScrim.style.opacity = (W() + off) / W();
    }
    function settle(open){
      el.drawer.style.transition = "";
      el.drawer.style.transform = "";
      el.drawerScrim.style.opacity = "";
      if (open) {
        el.drawer.classList.add("open");
        el.drawerScrim.classList.add("open");
        el.menuBtn.setAttribute("aria-expanded", "true");
        enterLayer("drawer");             // opened by gesture: back still closes it
      } else {
        closeDrawer();                    // takes the history entry back with it
      }
    }

    document.addEventListener("touchstart", function(ev){
      mode = null;
      if (ed || !el.scrim.hidden || usersOpen() || DRAG || ev.touches.length !== 1) return;
      var t = ev.touches[0];
      if (isOpen()) { mode = "close"; }
      else if (t.clientX <= drawerZone()) { mode = "open"; fillDrawer(); }
      else return;
      x0 = t.clientX; y0 = t.clientY; decided = false;
    }, {passive: true});

    document.addEventListener("touchmove", function(ev){
      if (!mode) return;
      var t = ev.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if (!decided) {
        // Let a vertical drag be a scroll; only commit to the drawer once the
        // movement is clearly sideways AND in the direction that makes sense.
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) { mode = null; return; }
        if (mode === "open" && dx < 10) return;
        if (mode === "close" && dx > -10) return;
        decided = true;
        // The drawer now owns this gesture. Whatever the card handler had
        // started with the same finger is abandoned, unacted — this is the
        // bug where reaching for the menu archived the note underneath.
        releaseCard(); unlatchCard();
        if (mode === "open") { el.drawer.classList.add("open"); el.drawerScrim.classList.add("open"); }
      }
      ev.preventDefault();
      track(dx);
    }, {passive: false});

    document.addEventListener("touchend", function(ev){
      if (!mode) return;
      var m = mode; mode = null;
      if (!decided) return;
      var dx = ((ev.changedTouches[0] || {}).clientX || x0) - x0;
      // Open on a decisive pull; close on any real leftward flick.
      settle(m === "open" ? dx > W() * 0.4 : dx > -40);
    }, {passive: true});

    document.addEventListener("touchcancel", function(){
      if (mode && decided) settle(isOpen() && mode !== "open");
      mode = null;
    }, {passive: true});
  })();

  // ---- pull down to sync ----
  // Only from the very top, only when nothing is layered over the wall.
  (function(){
    if (!("ontouchstart" in window)) return;
    var y0 = 0, pulling = false, dist = 0, THRESH = 72;
    function busy(){ return ed || !el.scrim.hidden || usersOpen() || el.drawer.classList.contains("open"); }
    document.addEventListener("touchstart", function(ev){
      if (busy() || window.scrollY > 0 || ev.touches.length !== 1) { pulling = false; return; }
      y0 = ev.touches[0].clientY; pulling = true; dist = 0;
    }, {passive: true});
    document.addEventListener("touchmove", function(ev){
      if (!pulling) return;
      dist = ev.touches[0].clientY - y0;
      if (dist <= 0) { el.ptr.hidden = true; return; }
      if (window.scrollY > 0) { pulling = false; el.ptr.hidden = true; return; }
      el.ptr.hidden = false;
      var d = Math.min(dist, 110);
      el.ptr.style.transform = "translate(-50%," + (d - 48) + "px) rotate(" + (d * 3) + "deg)";
      el.ptr.style.opacity = Math.min(1, d / THRESH);
    }, {passive: true});
    document.addEventListener("touchend", function(){
      if (!pulling) return;
      pulling = false;
      if (dist > THRESH) {
        el.ptr.classList.add("spin");
        el.ptr.style.transform = "translate(-50%, 10px)";
        syncNow().then(function(){
          el.ptr.classList.remove("spin"); el.ptr.hidden = true;
        });
      } else { el.ptr.hidden = true; }
    }, {passive: true});
  })();

  function columnCount(){
    var w = el.wall.clientWidth || window.innerWidth || 1280;
    if (w < 560) return 1;
    if (w < 860) return 2;
    if (w < 1180) return 3;
    return 4;
  }

  // Deal round-robin: card i goes to column i % cols. That makes the FIRST ROW
  // the newest cards reading left to right. CSS multicol filled each column
  // top to bottom instead, so column 3 held 2016 notes next to 2026 ones.
  function section(label, items, brass){
    var s = node("div", "section");
    s.appendChild(node("div", "eyebrow" + (brass ? " brass" : ""), label));
    var w = node("div", "wall");
    var cols = columnCount(), boxes = [];
    for (var i = 0; i < cols; i++) { boxes.push(node("div", "col")); w.appendChild(boxes[i]); }
    items.forEach(function(n, i){ boxes[i % cols].appendChild(swipeable(card(n), n)); });
    s.appendChild(w);
    return s;
  }

  // Build the wall a page at a time and grow it as you scroll. Rendering all
  // 545 cards up front was ~12,600 DOM nodes, and every keystroke rebuilt the
  // lot: 67 ms per character on a desktop over loopback, far worse on a phone.
  var PAGE = 60, CLIP_LINES = 9, shownCount = PAGE, io = null;

  // Queued notes render as real cards, marked, so a captured thought is
  // visibly on the wall rather than sitting invisibly in a database.
  function pendingCards(){
    return PENDING.map(function(p){
      return {
        id: "pending:" + p.key, title: p.title, preview: p.body,
        lines: p.body.split("\n").filter(function(l){ return l.trim(); }).length,
        truncated: p.body.length > 700, cat: "inbox", author: meName(),
        date: new Date(p.at).toISOString().slice(0, 10),
        pinned: false, archived: false, pending: true
      };
    });
  }

  function render(){
    LATCHED = null; SWIPING = null;       // the nodes these point at are about to go
    var shown = pendingCards().concat(NOTES).filter(matches);
    // With a query the server returns them RANKED; re-sorting by date here
    // would throw that away and bury the best match.
    if (!q) shown.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var pinned = shown.filter(pinnedForMe).sort(function(a, b){
      // My manual position wins; anything I never dragged keeps its date
      // place behind the ones I did.
      var ao = orderForMe(a), bo = orderForMe(b);
      if (ao !== bo) return ao - bo;
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    var rest = shown.filter(function(n){ return !pinnedForMe(n); });

    // Pinned always render in full -- there are a handful, and they are the
    // ones you came for. The page budget applies to everything else.
    var budget = Math.max(0, shownCount - pinned.length);
    var slice = rest.slice(0, budget);
    var more = rest.length - slice.length;

    if (io) { io.disconnect(); io = null; }
    el.wall.textContent = "";
    if (!shown.length) {
      var em = node("div", "empty");
      em.appendChild(node("div", null,
        LOADING ? "Loading…"
          : view === "trash" ? "Nothing deleted. Notes you delete land here and can be put back."
          : showArchive() ? "Nothing archived yet."
          : "No notes match " + (q ? '"' + q + '"' : "that filter") + "."));
      el.wall.appendChild(em);
    } else {
      if (pinned.length) el.wall.appendChild(section("Pinned", pinned, true));
      if (slice.length) el.wall.appendChild(section(
        onlyQueued ? "Waiting to sync"
          : view === "trash" ? "Deleted — tap to put back"
          : showArchive() ? "Archived"
          : q ? shown.length + " matching"
          : pinned.length ? "Everything else" : "All notes", slice, false));
      if (more > 0) el.wall.appendChild(sentinel(more));
    }
    drawSel();
    el.count.textContent = shown.length === NOTES.length
      ? NOTES.length + " notes"
      : shown.length + " / " + NOTES.length;
    chips();
    drawWho();
  }

  // Grows the wall when it scrolls into view; also a real button, so the page
  // still works if IntersectionObserver is unavailable or never fires.
  function sentinel(more){
    var b = node("button", "more-btn", "Show " + Math.min(PAGE, more) + " more  (" + more + " left)");
    b.addEventListener("click", function(){ shownCount += PAGE; render(); });
    if (window.IntersectionObserver) {
      io = new IntersectionObserver(function(es){
        if (es.some(function(e){ return e.isIntersecting; })) { shownCount += PAGE; render(); }
      }, {rootMargin: "600px"});
      io.observe(b);
    }
    return b;
  }

  // ---- search suggestions: categories AND note titles ----
  // Categories come from the full census so they stay suggestible while the
  // typed text is narrowing the notes; titles come from whatever the server
  // last matched.
  function closeSug(){
    el.sug.hidden = true;
    el.q.setAttribute("aria-expanded", "false");
  }

  function suggest(){
    var raw = el.q.value;
    var t = raw.trim().toLowerCase();
    el.sug.textContent = "";
    if (!t) { closeSug(); return; }

    // Once you have typed a prefix, you have said what KIND of thing you are
    // after — so suggest only that kind, and narrow it on what follows the
    // colon rather than on the whole query.
    var last = raw.split(/\s+/).pop().toLowerCase();
    var mode = last.indexOf("cat:") === 0 ? "cat"
             : last.indexOf("by:") === 0 ? "by"
             : last.indexOf("in:") === 0 ? "in" : "all";
    var frag = mode === "cat" ? last.slice(4)
             : mode === "by" ? last.slice(3)
             : mode === "in" ? last.slice(3) : t;

    var STATES = [["shared", "the shared space"], ["archived", "archived notes"],
                  ["trash", "deleted notes"], ["queued", "waiting to sync"]];
    var states = (mode === "in")
      ? STATES.filter(function(p){ return !frag || p[0].indexOf(frag) >= 0; })
      : (mode === "all" && "in:".indexOf(t) === 0) ? STATES : [];
    var unfiled = NOTES.filter(function(n){ return n.filed === false; }).length;
    var wantNone = (mode === "cat" && "none".indexOf(frag) === 0) ||
                   (mode === "all" && t.length > 1 && "uncategorised".indexOf(t) === 0);
    var cats = (mode === "by" || mode === "in") ? [] :
      Object.keys(CATS).filter(function(c){ return !frag || c.indexOf(frag) >= 0; })
        .sort(function(a, b){ return CATS[b] - CATS[a]; }).slice(0, mode === "cat" ? 8 : 5);
    var people = (mode === "cat" || mode === "in") ? [] :
      Object.keys(AUTHORS).filter(function(a){ return !frag || a.indexOf(frag) >= 0; })
        .slice(0, mode === "by" ? 8 : 4);
    var titles = (mode === "all")
      ? NOTES.filter(function(n){ return n.title.toLowerCase().indexOf(t) >= 0; }).slice(0, 6)
      : [];
    if (!cats.length && !titles.length && !people.length && !states.length && !wantNone) { closeSug(); return; }

    if (wantNone) {
      el.sug.appendChild(node("div", "sug-head", "Unfiled"));
      var nb = node("button");
      nb.setAttribute("role", "option");
      nb.appendChild(node("span", "tag", "cat:none"));
      nb.appendChild(node("span", "t", "notes with no category"));
      if (unfiled) nb.appendChild(node("span", "n", unfiled));
      nb.addEventListener("click", function(){
        q = "cat:none"; el.q.value = q + " "; closeSug(); el.q.focus();
        refresh().catch(function(e){ fail("Couldn't filter", e); });
      });
      el.sug.appendChild(nb);
    }

    if (states.length) {
      el.sug.appendChild(node("div", "sug-head", "Status — filters with in:"));
      states.forEach(function(p){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "tag", p[0])));
        b.appendChild(node("span", "t", p[1]));
        b.addEventListener("click", function(){
          q = "in:" + p[0]; el.q.value = q + " "; closeSug(); el.q.focus();
          refresh().catch(function(e){ fail("Couldn't filter", e); });
        });
        el.sug.appendChild(b);
      });
    }

    if (cats.length) {
      el.sug.appendChild(node("div", "sug-head", "Categories — filters with cat:"));
      cats.forEach(function(c){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "tag", c.replace(/-/g, " "))));
        b.appendChild(node("span", "n", CATS[c]));
        b.addEventListener("click", function(){ setCat(c); el.q.focus(); });
        el.sug.appendChild(b);
      });
    }
    if (people.length) {
      el.sug.appendChild(node("div", "sug-head", "People — filters with by:"));
      people.forEach(function(p){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "tag", p)));
        b.appendChild(node("span", "n", AUTHORS[p]));
        b.addEventListener("click", function(){
          q = "by:" + p; el.q.value = q + " "; closeSug(); el.q.focus();
          refresh().catch(function(e){ fail("Couldn't filter", e); });
        });
        el.sug.appendChild(b);
      });
    }
    if (titles.length) {
      el.sug.appendChild(node("div", "sug-head", "Notes"));
      titles.forEach(function(n){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "t", n.title)));
        b.appendChild(node("span", "n", n.date));
        b.addEventListener("click", function(){ closeSug(); open(n.id); });
        el.sug.appendChild(b);
      });
    }
    el.sug.hidden = false;
    el.q.setAttribute("aria-expanded", "true");
  }

  // ---- category chooser ----
  // Lists what exists AND takes a new name, because a chooser that can only
  // pick from a fixed list is how taxonomies ossify.
  function closeCatPop(){
    el.catpop.hidden = true;
    el.edCatBtn.setAttribute("aria-expanded", "false");
  }

  // Owner and sharing are one menu because they are one question — "who is
  // this note for" — and two adjacent person icons were two things to guess at.
  function fillPeopleMenu(){
    var now = (ed && ed.note && ed.note.author) || DEFAULT_AUTHOR;
    var isShared = !!(ed && ed.note && ed.note.shared);
    el.peopleMenu.textContent = "";
    el.peopleMenu.appendChild(node("div", "head", "Owner"));
    // People who exist, and nobody else. Typing a name here used to conjure
    // one, which made sense when a cookie was the only notion of identity;
    // now that sign-ins are recorded and named in Users, an owner invented
    // at this prompt is one nothing can ever resolve to a real person.
    var names = Object.keys(PEOPLE);
    Object.keys(AUTHORS).forEach(function(a){
      if (a !== "claude" && names.indexOf(a) < 0) names.push(a);
    });
    if (names.indexOf(DEFAULT_AUTHOR) < 0) names.unshift(DEFAULT_AUTHOR);
    if (now !== "claude" && names.indexOf(now) < 0) names.push(now);
    names.forEach(function(p){
      var b = node("button", null, nameOf(p));
      b.setAttribute("aria-pressed", p === now ? "true" : "false");
      if (AUTHORS[p]) b.appendChild(node("span", "n", AUTHORS[p]));
      b.addEventListener("click", function(){ closeMenus(null); setOwner(p); });
      el.peopleMenu.appendChild(b);
    });
    el.peopleMenu.appendChild(node("div", "sep"));
    var sh = node("button", null, (isShared ? "\u2713 " : "") + "Share note");
    sh.setAttribute("aria-pressed", isShared ? "true" : "false");
    sh.addEventListener("click", function(ev){
      ev.stopPropagation();
      if (!ed || !ed.note) return;
      var n = ed.note, was = !!n.shared;
      commit().then(function(){
        return persist(n, {shared:!was}, "Couldn't change sharing");
      }).then(function(){
        fillPeopleMenu(); syncBar();
        toast(was ? "Removed from Ours" : "Added to Ours", function(){
          persist(n, {shared:was}, "Couldn't undo that").then(syncBar).catch(function(){});
        });
      }).catch(function(){});
    });
    el.peopleMenu.appendChild(sh);
  }

  function setOwner(value){
    if (!ed || !ed.note) return;
    if (value === (ed.note.author || DEFAULT_AUTHOR)) return;
    var n = ed.note;
    persist(n, {author:value}, "Couldn't change who owns this").then(function(){
      el.edWhoNow.textContent = nameOf(n.author || meName());
      return refresh();
    }).catch(function(){});
  }

  el.edPeopleBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    if (!ed || !ed.note) return;
    toggleMenu(el.peopleMenu, el.edPeopleBtn, fillPeopleMenu);
  });

  function drawCatList(){
    var typed = el.edCat.value.trim().toLowerCase();
    var now = (ed && ed.note && ed.note.cat) || "";
    el.catlistBox.textContent = "";

    function row(label, value, count, isNew){
      var b = node("button", isNew ? "new" : null);
      b.setAttribute("aria-pressed", value === now ? "true" : "false");
      b.appendChild(document.createTextNode(label));
      if (count !== null) b.appendChild(node("span", "n", count));
      b.addEventListener("click", function(){ setCategory(value); });
      return b;
    }

    var keys = Object.keys(CATS).filter(function(c){ return !typed || c.indexOf(typed) >= 0; })
      .sort(function(a, b){ return CATS[b] - CATS[a] || (a < b ? -1 : 1); });
    var slug = typed.replace(/[^a-z0-9 _-]+/g, "").trim().replace(/\s+/g, "-");
    if (slug && keys.indexOf(slug) < 0) el.catlistBox.appendChild(row("+ " + slug, slug, null, true));
    keys.forEach(function(c){ el.catlistBox.appendChild(row(c.replace(/-/g, " "), c, CATS[c], false)); });
    if (now) el.catlistBox.appendChild(row("— none —", "", null, false));
    if (!el.catlistBox.children.length) el.catlistBox.appendChild(node("div", "sug-head", "no match — type to create"));
  }

  function setCategory(value){
    if (!ed || !ed.note) return;
    closeCatPop();
    if (value === (ed.note.cat || "")) return;
    var n = ed.note;
    persist(n, {category:value}, "Couldn't set the category").then(function(){
      el.edCatNow.textContent = n.cat || "none";
      return refresh();                 // the census changed
    }).catch(function(){});
  }

  // "Mine" needs to know who you are. Without a device identity everyone is
  // the owner, which is exactly what the 545 notes predating this assume.
  function meName(){ return ME || DEFAULT_AUTHOR; }

  // "Ours" is a place, not a union. A note is in it because somebody put it
  // there, exactly like archived — so your own feed is YOUR notes, plus the
  // shared ones if you want them (you do, by default).
  // Archived FOR ME. A shared note the other person put away is still on my wall, and
  // vice versa — archive is "I am done with this", not a claim about anyone
  // else. A note with no named archiver falls back to the old global flag,
  // which is what the 764 imported from Keep carry.
  // Pinned FOR ME, and MY position in the pinned row. A pin means "keep this
  // at the top for me" — the other person pinning the grocery list should not pin it for
  // one person, and one person's arrangement of their pinned row is not the other's.
  function pinnedForMe(n){
    if (n.pinned_by && n.pinned_by.length) return n.pinned_by.indexOf(meName()) >= 0;
    return !!n.pinned;
  }
  function orderForMe(n){
    var m = n.pin_order || {};
    var v = m[meName()];
    return (v === undefined || v === null) ? Infinity : v;
  }

  function archivedForMe(n){
    if (n.archived_by && n.archived_by.length) return n.archived_by.indexOf(meName()) >= 0;
    return !!n.archived;
  }

  function inScope(n, scope){
    if (scope === "all") return true;              // literally everything
    if (scope === "shared") return !!n.shared;
    return n.author === meName() || (SHOW_SHARED && !!n.shared);   // "mine"
  }

  function drawWho(){
    var opts = [["mine", "Mine"], ["shared", "Ours"], ["all", "All"]];
    el.who.textContent = "";
    opts.forEach(function(o){
      var n = NOTES.filter(function(x){ return inScope(x, o[0]); }).length;
      var b = node("button", null, o[1]);
      b.setAttribute("aria-pressed", who === o[0] ? "true" : "false");
      b.setAttribute("title", n + (n === 1 ? " note" : " notes"));
      b.addEventListener("click", function(){
        who = o[0];
        // A by: token in the box would re-decide the scope on the next
        // refresh, so picking one by hand drops it.
        var rest = (q || "").split(/\s+/).filter(function(x){
          return x && x.toLowerCase().indexOf("by:") !== 0;
        }).join(" ");
        if (rest !== q) { q = rest; el.q.value = q ? q + " " : ""; }
        refresh().catch(function(e){ fail("Couldn't switch", e); });
      });
      el.who.appendChild(b);
    });
    drawMe();
  }

  // ---- who is on this device ----
  // A cookie, not an account. The ask was "I don't want to set up auth or accounts
  // really... There's no secrets here to protect." It replaces Keep's
  // add-collaborator dance; the server reads the same cookie when stamping a
  // new note, so attribution does not depend on the client asking nicely.
  // One open menu at a time, and clicking the trigger again closes it —
  // three popovers with three behaviours would be three things to learn.
  var OPEN_MENU = null;
  function closeMenus(except){
    [[el.meMenu, el.meBtn], [el.peopleMenu, el.edPeopleBtn], [el.delMenu, el.edDel]].forEach(function(p){
      if (p[0] && p[0] !== except) { p[0].hidden = true; if (p[1]) p[1].setAttribute("aria-expanded", "false"); }
    });
    if (typeof closeCatPop === "function") closeCatPop();
    OPEN_MENU = except || null;
  }
  function toggleMenu(menu, trigger, fill){
    var opening = menu.hidden;
    closeMenus(opening ? menu : null);
    if (!opening) { menu.hidden = true; trigger.setAttribute("aria-expanded", "false"); return false; }
    fill();
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    return true;
  }
  document.addEventListener("click", function(ev){
    if (!OPEN_MENU) return;
    if (OPEN_MENU.contains(ev.target)) return;
    if (ev.target.closest && ev.target.closest(".anchor")) return;
    closeMenus(null);
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && OPEN_MENU) { closeMenus(null); }
  });

  // Who this browser's sign-in belongs to, from /api/whoami. Deliberately
  // NOT from the listing: that response is cached, and identity in a cached
  // body is what made the app forget who you were on every reload.
  var WHOAMI = null;

  // Who an unlabelled note belongs to. This MUST agree with the store's own
  // default (NOTES_DEFAULT_AUTHOR) — it decides which notes read as archived
  // and pinned for you, so a client-side literal that drifts from the server
  // silently shows the wrong wall. Cached so an offline first paint, which
  // happens before /api/whoami lands, still agrees.
  var DEFAULT_AUTHOR = "owner";
  try { DEFAULT_AUTHOR = localStorage.getItem("notes_default_author") || DEFAULT_AUTHOR; } catch (e) {}

  // Choosing an account for this browser. With a proxy in front the sign-in
  // is not ours to change, so this only matters without one.
  function setMe(userId){
    var v = (userId || "").trim().toLowerCase();
    if (!v) return;
    if (!(WHOAMI && WHOAMI.fixed)) writeCookieMe(v);
    ME = v;
    closeMenus(null);
    loadWhoami().then(function(){ return refresh(); }).catch(function(){});
  }

  // ---- the sign-in overlay ----
  // A browser that has never said who it is gets this, not a popover: on a
  // fresh load it is the only question worth answering. Dismissable, because
  // everything works unattributed and a notes app must not hold you hostage.
  function signinOpen(){ return !el.signinScrim.hidden; }

  // Adding someone from Users is the same form, but it must not claim this
  // browser's sign-in or switch who you are afterwards.
  var ADDING_OTHER = false;

  var USERNAME_OK = /^[a-z][a-z0-9_-]{0,31}$/;
  function checkUsername(){
    var v = (el.suUser.value || "").trim().toLowerCase();
    var taken = ((WHOAMI && WHOAMI.users) || []).some(function(u){ return u.username === v; });
    var ok = USERNAME_OK.test(v) && !taken;
    el.suUser.classList.toggle("bad", !!v && !ok);
    el.suHint.classList.toggle("bad", !!v && !ok);
    el.suHint.textContent = !v
      ? "Lowercase letters, digits, - and _. This is what notes record, and it does not change."
      : taken ? "\u201c" + v + "\u201d is taken \u2014 pick another."
      : !USERNAME_OK.test(v) ? "Start with a letter; then letters, digits, - or _ only."
      : "Notes will be recorded as \u201c" + v + "\u201d. This does not change later.";
    el.suGo.disabled = !ok;
    return ok;
  }

  function openSignIn(){
    if (signinOpen()) return;
    var d = WHOAMI || {};
    var list = d.users || [];
    var fixed = !!d.fixed, unknown = !!d.unknown;

    el.signinTitle.textContent = ADDING_OTHER ? "Add someone"
      : (list.length ? "Who are you?" : "Create an account");
    el.signinSub.textContent = ADDING_OTHER
      ? "They choose their own display name later. The username is what their notes are recorded under."
      : unknown && d.sign_in
        ? "You are signed in as " + d.sign_in + ", which no account claims yet. Pick yourself to attach it, or make a new account."
        : list.length
          ? "Pick an account for this device. Notes you write are recorded under it."
          : "Nobody has an account here yet. Yours will be the first.";

    el.signinList.textContent = "";
    list.forEach(function(u){
      var b = node("button");
      b.type = "button";
      b.appendChild(document.createTextNode(u.label));
      if (u.label !== u.username) b.appendChild(node("span", "u", u.username));
      b.addEventListener("click", function(){
        // With a proxy in front, picking an account means "that sign-in is
        // mine" \u2014 attach it, rather than claiming to be someone else.
        if (fixed && unknown && d.sign_in) {
          api("PUT", "/api/users", {username: u.username, add_emails: [d.sign_in]})
            .then(function(){ closeSignIn(); setMe(u.username); })
            .catch(function(e){ fail("Couldn't link that sign-in", e); });
        } else { closeSignIn(); setMe(u.username); }
      });
      el.signinList.appendChild(b);
    });
    el.signinList.hidden = ADDING_OTHER || !list.length;
    el.signinOr.hidden = el.signinList.hidden;   // it separates a list from a form

    el.suUser.value = (ADDING_OTHER ? "" : d.suggest_username) || "";
    el.suName.value = (ADDING_OTHER ? "" : d.suggest_name) || "";
    el.suMail.value = (!ADDING_OTHER && d.sign_in && d.sign_in.indexOf("@") > 0) ? d.sign_in : "";
    checkUsername();
    hideDrawer();                 // modal: nothing it was opened from stays over it
    el.signinScrim.hidden = false;
    enterLayer("signin");
    if (ADDING_OTHER || !list.length) el.suUser.focus();
  }

  function closeSignIn(fromHistory){
    if (el.signinScrim.hidden) return;
    ADDING_OTHER = false;
    el.signinScrim.hidden = true;
    if (fromHistory !== true) exitLayer();
    // The Users sheet may still be open behind this one. It owned the layer
    // before the dialog took it; give it back, or the next back press exits
    // the app instead of closing the sheet.
    if (usersOpen() && !LAYER) LAYER = "users";
  }

  el.suUser.addEventListener("input", checkUsername);
  el.signinForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (!checkUsername()) return;
    var adding = ADDING_OTHER;
    var body = {
      username: (el.suUser.value || "").trim().toLowerCase(),
      name: (el.suName.value || "").trim(),
      claim_sign_in: !adding
    };
    var mail = (el.suMail.value || "").trim();
    if (mail) body.emails = [mail];
    el.suGo.disabled = true;
    api("POST", "/api/users", body).then(function(d){
      closeSignIn();
      if (adding) { reloadUsers(); loadWhoami(); }
      else setMe(d.user.username);
    }).catch(function(e){
      el.suGo.disabled = false;
      if (/already taken/i.test((e && e.message) || "")) { checkUsername(); el.suUser.focus(); }
      else fail("Couldn't create that account", e);
    });
  });
  el.signinScrim.addEventListener("click", function(ev){
    if (ev.target === el.signinScrim) closeSignIn();
  });

  function loadWhoami(){
    return api("GET", "/api/whoami").then(function(d){
      WHOAMI = d;
      if (d.default_author) {
        DEFAULT_AUTHOR = d.default_author;
        try { localStorage.setItem("notes_default_author", DEFAULT_AUTHOR); } catch (e) {}
      }
      if (d.users) {
        PEOPLE = {};
        d.users.forEach(function(u){ PEOPLE[u.username] = u.label; });
      }
      ME = d.me || ME;
      drawMe();
      return d;
    }).catch(function(){ return null; });
  }

  function drawMe(){
    el.meBtn.textContent = ME ? ME.charAt(0).toUpperCase() : "?";
    el.meBtn.className = "me-btn" + (ME ? "" : " unset");
    el.meBtn.title = ME ? ("This device is " + ME + " — tap to change") : "Who's using this device?";
  }

  function fillMeMenu(){
    var unknown = WHOAMI && WHOAMI.unknown;
    var fixed = WHOAMI && WHOAMI.fixed;
    var list = (WHOAMI && WHOAMI.users) || [];
    el.meMenu.textContent = "";
    el.meMenu.appendChild(node("div", "head",
      unknown ? "Who are you?" : (fixed ? "Signed in as" : "This device is")));
    list.forEach(function(u){
      var b = node("button", null, u.label);
      b.setAttribute("aria-pressed", ME === u.username ? "true" : "false");
      b.addEventListener("click", function(){
        // With a proxy, picking an existing account means "that sign-in is
        // mine" — attach it, rather than pretending to be somebody else.
        if (fixed && unknown && WHOAMI.sign_in) {
          api("PUT", "/api/users", {username: u.username, add_emails: [WHOAMI.sign_in]})
            .then(function(){ setMe(u.username); })
            .catch(function(e){ fail("Couldn't link that sign-in", e); });
        } else { setMe(u.username); }
      });
      el.meMenu.appendChild(b);
    });
    // No "create an account" here. This menu switches between the people who
    // exist; making a new one is a different job and it lives in Users. The
    // one case that needs it without Users — a space with no accounts at all
    // — never reaches this menu, because the sign-in overlay takes that.
    if (unknown && WHOAMI.sign_in && fixed) {
      el.meMenu.appendChild(node("div", "head", "signed in as " + WHOAMI.sign_in));
    }
    el.meMenu.appendChild(node("div", "sep"));
    var sh = node("button", null, (SHOW_SHARED ? "\u2713 " : "") + "show Ours in my feed");
    sh.setAttribute("aria-pressed", SHOW_SHARED ? "true" : "false");
    sh.addEventListener("click", function(ev){
      ev.stopPropagation();
      SHOW_SHARED = !SHOW_SHARED;
      try { localStorage.setItem("notes-show-shared", SHOW_SHARED ? "1" : "0"); } catch (e) {}
      fillMeMenu(); render();
    });
    el.meMenu.appendChild(sh);
    // The only door to Users on a desktop: the drawer that holds it on a
    // phone is replaced by the chip row above 700px. Here rather than in that
    // row because it is about people, not a way of filtering notes.
    el.meMenu.appendChild(node("div", "sep"));
    var mu = node("button", null, "Users");
    mu.addEventListener("click", function(ev){
      ev.stopPropagation();
      closeMenus(null);
      openUsers();
    });
    el.meMenu.appendChild(mu);
  }

  function openWhoBar(){ toggleMenu(el.meMenu, el.meBtn, fillMeMenu); }
  el.meBtn.addEventListener("click", function(ev){ ev.stopPropagation(); openWhoBar(); });

  // The ONE way to filter by category is the cat: token in the search box.
  // A chip writes that token rather than flipping hidden state, so the chip
  // and the typed syntax are the same mechanism and clicking one teaches the
  // other. There is no separate filter variable to drift out of sync.
  function activeCat(){
    var m = (q || "").toLowerCase().match(/(?:^|\s)cat:(\S+)/);
    return m ? m[1] : "";
  }

  // Picking a category REPLACES the query. Someone searched "wood", clicked the
  // suggested woodgas category and got "cat:woodgas wood" — the terms typed
  // typed to FIND the category then narrowed it. Clicking a category means
  // that category.
  function setCat(value){
    q = value ? "cat:" + value : "";
    el.q.value = q ? q + " " : "";
    closeSug();
    refresh().catch(function(e){ fail("Couldn't filter", e); });
  }

  function chips(){
    // Counts come from the server's full census, not from NOTES — once a
    // cat: filter is applied NOTES holds only that category, and chips built
    // from it would collapse to a single entry.
    // CATS is now scoped to the current feed by the server, so a chip never
    // promises notes the wall will not show.
    var counts = CATS, active = activeCat();
    var keys = Object.keys(counts).sort(function(a, b){
      return counts[b] - counts[a] || (a < b ? -1 : 1);
    });
    // Measure the viewport, not el.chips: the chip row is content-sized, so
    // its own clientWidth is whatever the LAST render put in it — a feedback
    // loop that settles on two chips no matter how wide the window is.
    var avail = (window.innerWidth || 900) - 300;   // brand + the Mine/Claude/Both control
    var room = Math.max(2, Math.floor(avail / 150));
    if (active && keys.indexOf(active) >= room) {       // keep the active one visible
      keys.splice(room - 1, 0, keys.splice(keys.indexOf(active), 1)[0]);
    }
    keys = keys.slice(0, room);

    var total = 0;
    Object.keys(counts).forEach(function(k){ total += counts[k]; });

    el.chips.textContent = "";
    function mk(label, value, n){
      var b = node("button", "chip");
      b.setAttribute("aria-pressed", active === value ? "true" : "false");
      b.appendChild(document.createTextNode(label));
      b.appendChild(node("b", null, n));

  // --- editor: the card, expanded ---
  // Blocks are the editing unit. One row per line, uniform: Enter makes the next
  // row, Backspace on an empty row removes it. Nothing here needs markdown typed.
  var ed = null, saveT = null, focusIdx = -1, focusEnd = false;

  function parseBlocks(body){
    var out = [];
    body.split("\n").forEach(function(line){
      var m;
      if (/^\s*$/.test(line)) return;
      if ((m = line.match(/^#{1,4}\s+(.*)$/))) out.push({t:"sec", x:m[1]});
      else if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s*(.*)$/))) out.push({t:"item", ck:true, done:m[1].toLowerCase() === "x", x:m[2]});
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) out.push({t:"item", ck:false, done:false, x:m[1]});
      else if ((m = line.match(/^\*(?!\*)(.+)\*\s*$/))) out.push({t:"note", x:m[1]});
      else out.push({t:"text", x:line});
    });
    if (!out.length) out.push({t:"text", x:""});
    return out;
  }

  function serialize(blocks){
    var lines = [];
    blocks.forEach(function(b, i){
      if (b.t === "sec") { if (i) lines.push(""); lines.push("## " + b.x); }
      else if (b.t === "item" && b.ck) lines.push("- [" + (b.done ? "x" : " ") + "] " + b.x);
      else if (b.t === "item") lines.push("- " + b.x);
      else if (b.t === "note") lines.push("*" + b.x + "*");
      else lines.push(b.x);
    });
    return lines.join("\n");

  function bodyNow(){ return ed.raw !== null ? ed.raw : serialize(ed.blocks); }

  // a section run is the stretch of rows between two headings
  function runOf(i){

      // keystroke updates rather than creating a second file.

        el.edPath.textContent = saved.id + (saved.date ? "  ·  edited " + saved.date : "");

  function mkRow(b, i){

    if (LAYER === "drawer") LAYER = "users";   // inherited from the drawer row
    else enterLayer("users");
    el.usersBody.textContent = "";
    el.usersBody.appendChild(node("div", "empty", "Loading…"));
    reloadUsers();
  }

  function reloadUsers(){
    return api("GET", "/api/users").then(function(d){
      USERS = d;
      PEOPLE = {};
      d.users.forEach(function(u){ PEOPLE[u.username] = u.label; });
      drawUsers();
    }).catch(function(e){
      el.usersBody.textContent = "";
      el.usersBody.appendChild(node("div", "empty",
        "Couldn't load the user list — " + ((e && e.message) || "unknown error")));
    });
  }

  function closeUsers(fromHistory){
    if (el.usersScrim.hidden) return;
    el.usersScrim.hidden = true;
    if (fromHistory !== true) exitLayer();
    render();
  }

  function saveUser(body){
    return api("PUT", "/api/users", body)
      .then(reloadUsers)
      .catch(function(e){ fail("Couldn't save that", e); });
  }

  function drawUsers(){
    var d = USERS;
    el.usersBody.textContent = "";
    el.usersPath.textContent = d.file + "  ·  a markdown table you can also edit by hand";

    var intro = node("div", "u-intro");
    intro.appendChild(document.createTextNode(
      "Each person has an account. The display name is a label — change it "
      + "freely, and two people may share one. The username beside it is what "
      + "notes record, so it is set once and stays. Emails let a sign-in that "
      + "was authenticated elsewhere be recognised as that account."));
    el.usersBody.appendChild(intro);

    d.users.forEach(function(u){ el.usersBody.appendChild(userCard(u, d)); });

    var add = node("button", "u-add", "Add someone");
    add.addEventListener("click", function(){
      // The same form as signing in, so there is one place that explains what
      // a username is and one place that checks it is free.
      WHOAMI = WHOAMI || {};
      WHOAMI.users = d.users;
      WHOAMI.suggest_username = "";
      WHOAMI.suggest_name = "";
      ADDING_OTHER = true;
      openSignIn();
    });
    el.usersBody.appendChild(add);
  }

  function userCard(u, d){
    var box = node("div", "u-card");

    var row = node("div", "u-person");
    var inp = node("input", "u-name");
    inp.value = u.name || "";
    inp.placeholder = u.username;
    inp.setAttribute("aria-label", "Display name for " + u.username);
    inp.addEventListener("change", function(){ saveUser({username: u.username, name: inp.value}); });
    row.appendChild(inp);
    row.appendChild(node("span", "u-slug", u.username + (u.username === d.me ? " · you" : "")));
    box.appendChild(row);

    var mails = node("div", "u-ids");
    u.emails.forEach(function(e){
      var line = node("div", "u-id");
      var head = node("span", "idline");
      head.appendChild(node("span", "src", "email"));
      head.appendChild(node("span", "who", e));
      line.appendChild(head);
      var off = node("button", "u-detach", "remove");
      off.setAttribute("title", "Stop recognising " + e + " as " + u.username);
      off.addEventListener("click", function(){
        saveUser({username: u.username, remove_emails: [e]});
      });
      line.appendChild(off);
      mails.appendChild(line);
    });
    var addMail = node("button", "u-addmail",
      u.emails.length ? "add another email" : "add an email for sign-in");
    addMail.addEventListener("click", function(){
      var e = window.prompt("Email that signs in as " + (u.name || u.username) + ":", "");
      if (e) saveUser({username: u.username, add_emails: [e]});
    });
    mails.appendChild(addMail);
    box.appendChild(mails);
    return box;
  }

  el.usersClose.addEventListener("click", function(){ closeUsers(); });
  el.usersScrim.addEventListener("click", function(ev){
    if (ev.target === el.usersScrim) closeUsers();
  });

  function openDrawer(){
    fillDrawer();
    el.drawer.classList.add("open");
    el.drawerScrim.classList.add("open");
    el.menuBtn.setAttribute("aria-expanded", "true");
    // The drawer covers the wall, so back must close it rather than leave the
    // app — it was the one layer that never pushed a history entry.
    enterLayer("drawer");
  }
  // Visual only: the caller keeps the drawer's history entry. Used when the
  // thing being opened is itself a layer — see openUsers.
  function hideDrawer(){
    el.drawer.classList.remove("open");
    el.drawerScrim.classList.remove("open");
    el.drawer.style.transform = "";
    el.menuBtn.setAttribute("aria-expanded", "false");
  }
  function closeDrawer(fromHistory){
    hideDrawer();
    if (fromHistory !== true) exitLayer();
  }
  el.menuBtn.addEventListener("click", function(){
    if (el.drawer.classList.contains("open")) closeDrawer(); else openDrawer();
  });
  el.drawerScrim.addEventListener("click", function(){ closeDrawer(); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && el.drawer.classList.contains("open")) closeDrawer();
  });

  // ---- keyboard ----
  // Ctrl/Cmd-F, -N and -S are taken over deliberately: the browser's own Find
  // only searches the ~60 cards currently in the DOM, which on a 586-note wall
  // is a worse answer than this page's own search, delivered confidently.
  document.addEventListener("keydown", function(ev){
    var mod = ev.ctrlKey || ev.metaKey;
    if (!mod || ev.altKey) return;
    var k = (ev.key || "").toLowerCase();
    if (k === "f") {
      ev.preventDefault();
      el.q.focus(); el.q.select(); suggest();
    } else if (k === "n") {
      ev.preventDefault();
      if (!ed) open(null);
    } else if (k === "s") {
      ev.preventDefault();
      syncNow();
    }
  });

  // Ctrl-S means "flush whatever is pending and re-read", which is the honest
  // meaning of save here: edits already autosave, so the useful work is making
  // sure nothing is in flight and the wall matches the disk.
  function syncNow(){
    var p = ed ? commit() : Promise.resolve();
    return p.then(refresh).then(function(){
      setNet(true);
      toast(ed ? "Saved" : "Synced", null);
    }).catch(function(e){ fail("Sync failed", e); });
  }

  // ---- service worker ----
  // Unregister anything that is not ours FIRST. This origin ran SilverBullet's
  // PWA until 2026-11-09 and its worker still owns browsers that opened it —
  // serving a dead shell on every normal refresh. (The server also replies at
  // its old /service_worker.js with a self-destructing worker, because a
  // poisoned browser never gets far enough to run this.)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) {
        var src = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || "";
        if (src && src.indexOf("/sw.js") < 0) return r.unregister();
      }));
    }).then(function () {
      return navigator.serviceWorker.register("/sw.js", {scope: "/"});
    }).catch(function (e) { console.warn("service worker:", e); });
  }

  // ---- outbox: capture a NEW note with no connection ----
  // Deliberately creates only. A create cannot conflict — the server picks a
  // fresh filename — whereas replaying an EDIT can land on a file that one of
  // the other three writers of this space changed underneath it, and that
  // needs a precondition and a real conflict answer, not a queue.
  var DB = null, PENDING = [];

  function db(){
    if (DB) return Promise.resolve(DB);
    return new Promise(function(res, rej){
      if (!window.indexedDB) { rej(new Error("no indexedDB")); return; }
      var rq = indexedDB.open("notes-outbox", 2);
      rq.onupgradeneeded = function(){
        var d = rq.result;
        if (!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", {autoIncrement:true});
        // The last listing we successfully loaded. The app owns its offline
        // copy rather than relying on HTTP cache semantics: "if we have ever
        // loaded the app before it should have something to start with and
        // then sync from there" (decided 2026-11-09).
        if (!d.objectStoreNames.contains("snap")) d.createObjectStore("snap");
      };
      rq.onsuccess = function(){ DB = rq.result; res(DB); };
      rq.onerror = function(){ rej(rq.error); };
    });
  }

  function tx(mode, fn){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction("queue", mode), store = t.objectStore("queue"), out;
        out = fn(store);
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }

  // An editor session owns ONE queue entry. Without the key, the debounced
  // autosave queues the note and then closing queues it again — the same
  // thought lands twice, which is exactly the failure a capture tool must not
  // have.
  function snapSave(d){
    return db().then(function(dbh){
      return new Promise(function(res){
        var t = dbh.transaction("snap", "readwrite");
        t.objectStore("snap").put({at: Date.now(), data: d}, "listing");
        t.oncomplete = function(){ res(); };
        t.onerror = function(){ res(); };
      });
    }).catch(function(){});
  }

  function snapLoad(){
    return db().then(function(dbh){
      return new Promise(function(res){
        var rq = dbh.transaction("snap").objectStore("snap").get("listing");
        rq.onsuccess = function(){ res(rq.result || null); };
        rq.onerror = function(){ res(null); };
      });
    }).catch(function(){ return null; });
  }

  function enqueue(title, body, key){
    var rec = {title:title, body:body, at:Date.now()};
    return tx("readwrite", function(s){
      return key === undefined || key === null ? s.add(rec) : s.put(rec, key);
    }).then(function(k){
      return loadPending().then(function(){ return k; });
    });
  }

  function loadPending(){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var out = [], cur = d.transaction("queue").objectStore("queue").openCursor();
        cur.onsuccess = function(){
          var c = cur.result;
          if (!c) { PENDING = out; res(out); return; }
          out.push({key:c.key, title:c.value.title, body:c.value.body, at:c.value.at});
          c.continue();
        };
        cur.onerror = function(){ rej(cur.error); };
      });
    }).catch(function(){ PENDING = []; return []; });
  }

  var draining = false;
  function drain(){
    if (draining) return Promise.resolve();
    draining = true;
    return loadPending().then(function(items){
      // Oldest first, and stop at the first failure so order is preserved and
      // nothing is dropped on a flaky link.
      return items.reduce(function(chain, it){
        return chain.then(function(ok){
          if (!ok) return false;
          return api("POST", "/api/notes", {title:it.title, body:it.body})
            .then(function(){ return tx("readwrite", function(s){ s.delete(it.key); }); })
            .then(function(){ return true; })
            .catch(function(){ return false; });
        });
      }, Promise.resolve(true));
    }).then(function(){
      return loadPending();
    }).then(function(left){
      draining = false;
      if (left.length === 0) return refresh();
      render();
    }).catch(function(){ draining = false; });
  }

  // ---- online / offline ----
  // navigator.onLine only knows about the link, not whether THIS box is
  // reachable, so a failed request also flips it — and a success flips it back.
  var ONLINE = true;
  function setNet(up){
    if (up === ONLINE) { if (el.netTip && !el.netTip.hidden) showNetTip(); return; }
    ONLINE = up;
    if (el.netTip && !el.netTip.hidden) setTimeout(showNetTip, 0);
    el.net.className = "net" + (up ? "" : " off");
    el.net.title = up ? "Online — changes save as you type" : "Offline — changes are NOT being saved";
    el.net.innerHTML = up
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 6.5 19z"/><path d="m9.5 14.5 2 2 3.5-4"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 6.5 19z"/><path d="M3 3l18 18"/></svg>';
  }
  // ---- tapping the cloud says what it means ----
  // The icon alone only ever said online/offline, and `title` is a desktop
  // affordance: a phone has no hover, so on the device this matters most the
  // tooltip could not be read at all.
  function whenText(t){
    if (!t) return "never — nothing has loaded from the box yet";
    var d = new Date(t), now = new Date();
    var clock = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    var secs = Math.round((now - d) / 1000);
    if (secs < 45) return "just now";
    if (d.toDateString() !== now.toDateString()) {
      return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " at " + clock;
    }
    if (secs < 3600) return Math.round(secs / 60) + " min ago, at " + clock;
    return clock;
  }
  function netTipText(){
    var queued = (typeof pendingCards === "function" ? pendingCards().length : 0);
    var head = !ONLINE ? "Offline"
      : queued ? queued + (queued === 1 ? " note waiting to save" : " notes waiting to save")
      : "Synced";
    // Only say more when the headline leaves something unanswered. "Synced"
    // does not: explaining it just made the tip wordy.
    var tail = !ONLINE && queued
      ? "They go up when the box is reachable."
      : !ONLINE ? "Showing what loaded last. New notes are saved on this device."
      : "";
    return [head, tail, "Last synced " + whenText(LAST_SYNC)];
  }
  function showNetTip(){
    var parts = netTipText();
    el.netTip.textContent = "";
    el.netTip.appendChild(node("b", null, parts[0]));
    if (parts[1]) el.netTip.appendChild(document.createTextNode(" — " + parts[1]));
    el.netTip.appendChild(node("span", "when", parts[2]));
    el.netTip.hidden = false;
    var r = el.net.getBoundingClientRect(), w = el.netTip.offsetWidth;
    el.netTip.style.top = Math.round(r.bottom + 9) + "px";
    el.netTip.style.left = Math.round(Math.max(10,
      Math.min(window.innerWidth - w - 10, r.right - w + 8))) + "px";
    el.net.setAttribute("aria-expanded", "true");
  }
  function hideNetTip(){
    el.netTip.hidden = true;
    el.net.setAttribute("aria-expanded", "false");
  }
  el.net.addEventListener("click", function(ev){
    ev.stopPropagation();
    if (el.netTip.hidden) { closeMenus(null); showNetTip(); } else hideNetTip();
  });
  document.addEventListener("click", function(){ if (!el.netTip.hidden) hideNetTip(); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !el.netTip.hidden) hideNetTip();
  });

  ONLINE = false; setNet(true);                       // paint the initial state
  window.addEventListener("online", function(){ setNet(true); drain(); });
  window.addEventListener("offline", function(){ setNet(false); });

  // Column count is width-derived, so a rotation or a resize has to re-deal.
  var rsT = null;
  window.addEventListener("resize", function(){
    clearTimeout(rsT);
    rsT = setTimeout(function(){ if (!ed) render(); }, 150);
  });

  el.wall.appendChild(node("div", "empty", "Loading notes…"));
  loadPending().then(drain);

  // Paint whatever we had last time BEFORE waiting on the network. A fresh
  // reload used to sit blank for as long as the listing took — and on a bad
  // link, indefinitely. Now the wall is there instantly and the network just
  // updates it.
  snapLoad().then(function(snap){
    if (snap && snap.data && !NOTES.length) {
      applyListing(snap.data);
      setNet(ONLINE);
    }
  }).catch(function(){});

  refresh().then(function(){
    // A browser that has never said who it is, or a sign-in no account
    // claims, gets the OVERLAY rather than a popover tucked under an icon:
    // on a fresh load it is the only question worth answering. Everything
    // still works without answering — notes go to the default author, which
    // is what every note written before accounts existed did.
    loadWhoami().then(function(d){
      if (!d) return;
      if (!d.me || d.unknown) openSignIn();
    });
    // No adaptive default any more: "Mine" already includes the shared space,
    // so a second person sees the household's notes from their first visit
    // without being switched to a different view behind their back.
  }).catch(function(e){
    el.wall.textContent = "";
    var em = node("div", "empty");
    em.appendChild(node("div", null, "Couldn't reach the notes service."));
    em.appendChild(node("div", null, (e && e.message) || ""));
    el.wall.appendChild(em);
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
mark{background:var(--mark-bg); color:var(--mark-ink); border-radius:2px; padding:0 1px}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --ground:#eef1f0; --surface:#fdfdfc; --surface-2:#e7ebe9;
  --ink:#16211f; --ink-soft:#5a6a66; --ink-faint:#8697924d;
  --line:#d5dcd9; --line-strong:#bfc9c5;
  --accent:#136b63; --accent-ink:#ffffff; --accent-wash:#136b6314;
  --brass:#8d620f; --brass-wash:#8d620f17;
  --mark-bg:#f8e3a4; --mark-ink:#2b2005;
  --shadow:0 1px 2px #16211f0f, 0 0 0 1px #16211f0a;
  --shadow-lift:0 4px 14px #16211f1f, 0 0 0 1px #16211f14;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101514; --surface:#19201e; --surface-2:#222a28;
    --ink:#e4e9e7; --ink-soft:#93a19d; --ink-faint:#93a19d3d;
    --line:#2a3331; --line-strong:#3a4542;
    --accent:#55b9ad; --accent-ink:#07211f; --accent-wash:#55b9ad1f;
    --brass:#d4a13f; --brass-wash:#d4a13f1f;
    --mark-bg:#6d5518; --mark-ink:#f8ecd0;
    --shadow:0 1px 2px #0006, 0 0 0 1px #ffffff0d;
    --shadow-lift:0 6px 18px #0008, 0 0 0 1px #ffffff14;
  }
}
:root[data-theme="dark"]{
  --ground:#101514; --surface:#19201e; --surface-2:#222a28;
  --ink:#e4e9e7; --ink-soft:#93a19d; --ink-faint:#93a19d3d;
  --line:#2a3331; --line-strong:#3a4542;
  --accent:#55b9ad; --accent-ink:#07211f; --accent-wash:#55b9ad1f;
  --brass:#d4a13f; --brass-wash:#d4a13f1f;
  --mark-bg:#6d5518; --mark-ink:#f8ecd0;
  --shadow:0 1px 2px #0006, 0 0 0 1px #ffffff0d;
  --shadow-lift:0 6px 18px #0008, 0 0 0 1px #ffffff14;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- chrome ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
}
.bar-row{display:flex; align-items:center; gap:10px; max-width:1280px; margin:0 auto}
.brand{
  font:700 17px/1 Archivo,"Archivo",system-ui,sans-serif; letter-spacing:-.01em;
  display:flex; align-items:baseline; gap:8px; flex:none;
}
.brand b{color:var(--accent)}
.count{font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft); letter-spacing:.06em}
.search{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:0 12px; height:38px; box-shadow:var(--shadow);
}
.search svg{flex:none; color:var(--ink-soft)}
.search input{
  flex:1; min-width:0; border:0; background:none; color:var(--ink);
  font:400 15px/1 "IBM Plex Sans",system-ui,sans-serif; outline:none; height:100%;
}
.search input::placeholder{color:var(--ink-soft)}
.iconbtn{
  flex:none; display:grid; place-items:center; width:38px; height:38px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  color:var(--ink-soft); cursor:pointer; box-shadow:var(--shadow);
}
.iconbtn:hover{color:var(--ink); border-color:var(--line-strong)}
.iconbtn[aria-pressed="true"]{background:var(--accent-wash); border-color:var(--accent); color:var(--accent)}

.filters{display:flex; gap:10px; align-items:center; max-width:1280px; margin:0 auto; padding:10px 0}
.seg{flex:none; display:flex; border:1px solid var(--line); border-radius:999px; background:var(--surface); overflow:hidden}
.seg button{
  border:0; background:none; cursor:pointer; color:var(--ink-soft);
  padding:6px 12px; font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--line)}
.filters::before{content:none}
.filters .chips{border-left:1px solid var(--line); padding-left:10px}
.seg button:hover{color:var(--ink); background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
/* No scrollbar: show the categories that fit and drop the rest. Search is the
   way to reach the long tail. */
.chips{display:flex; gap:6px; min-width:0; flex:1 1 auto; overflow:hidden; flex-wrap:nowrap}
.chip{
  flex:none; cursor:pointer; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); border-radius:999px; padding:5px 11px;
  font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
  text-transform:uppercase; white-space:nowrap;
}
.chip b{font-weight:500; color:var(--ink-faint); margin-left:5px}
.chip:hover{border-color:var(--line-strong); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
.chip[aria-pressed="true"] b{color:var(--ground); opacity:.55}

/* ---------- wall ---------- */
main{max-width:1280px; margin:0 auto; padding:18px 14px 96px}
.eyebrow{
  display:flex; align-items:center; gap:9px; margin:4px 0 12px;
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
.eyebrow.brass{color:var(--brass)}
/* Columns are built in JS, not by CSS multicol. Multicol fills column 1 top to
   bottom before starting column 2, so on a newest-first wall the third column
   showed 2016 beside 2026 — reading ACROSS a row was meaningless. Cards are
   now dealt round-robin into these columns, so row 1 is the four newest. */
.wall{display:flex; align-items:flex-start; gap:14px}
.col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:14px}
.section{margin-bottom:26px}

.card{
  break-inside:avoid; -webkit-column-break-inside:avoid;
  background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
  margin:0; padding:13px 14px 10px; cursor:pointer; position:relative;
  transition:box-shadow .14s ease, transform .14s ease;
}
.card:hover{box-shadow:var(--shadow-lift)}
.card:active{transform:scale(.995)}
.card.pending{box-shadow:var(--shadow), inset 3px 0 0 var(--mark-bg); opacity:.92}
.card.pending .meta .cat{color:var(--brass)}
.card.pinned{box-shadow:var(--shadow), inset 3px 0 0 var(--brass)}
.card.pinned:hover{box-shadow:var(--shadow-lift), inset 3px 0 0 var(--brass)}
.card.untitled .body{padding-top:2px}
.card h3{
  margin:0 26px 7px 0;
  font:600 15px/1.3 Archivo,system-ui,sans-serif; letter-spacing:-.005em;
  text-wrap:balance;
}
.body{position:relative; max-height:184px; overflow:hidden}
.body.clipped::after{
  content:""; position:absolute; inset:auto 0 0; height:40px;
  background:linear-gradient(to bottom, transparent, var(--surface));
}
.body p{margin:0 0 5px; white-space:pre-wrap; overflow-wrap:break-word}
.body strong{font-weight:600}
.body code{font:400 .92em/1.4 "IBM Plex Mono",ui-monospace,monospace; background:var(--surface-2); border-radius:4px; padding:1px 4px}
@media (max-width:720px){.count{display:none}}
.body .h{margin:9px 0 4px; font:600 11px/1.3 Archivo,system-ui,sans-serif;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.body .li{display:flex; gap:7px; margin:0 0 3px; align-items:flex-start}
.body .li > span{flex:1; min-width:0; overflow-wrap:break-word}
.body .li::before{content:"\2022"; color:var(--ink-faint); line-height:1.5}
.body .ck{display:flex; gap:8px; margin:0 0 4px; align-items:flex-start}
.body .ck span{flex:1; overflow-wrap:break-word}
.body .ck.done span{color:var(--ink-soft); text-decoration:line-through}
.box{
  flex:none; width:15px; height:15px; margin-top:2px; border-radius:3px;
  border:1.5px solid var(--line-strong); background:none; cursor:pointer;
  display:grid; place-items:center; color:var(--accent-ink); padding:0;
}
.box.on{background:var(--accent); border-color:var(--accent)}
.more{
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft);
  letter-spacing:.05em; margin:6px 0 0;
}
.meta{
  display:flex; align-items:center; gap:8px; margin-top:9px;
  padding-top:8px; border-top:1px solid var(--line);
  font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft);
  letter-spacing:.04em;
}
.meta .cat{color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-weight:500}
.meta .sp{flex:1}
.meta .yr{font-variant-numeric:tabular-nums}
/* On a phone that row is category + author + shared + date and it crowds.
   The date lives on the note's own grey line next to the filename instead. */
@media (max-width:700px){.meta .yr{display:none}}
.pin{
  position:absolute; top:9px; right:8px; width:26px; height:26px; padding:0;
  display:grid; place-items:center; border:0; border-radius:7px;
  background:none; color:var(--ink-faint); cursor:pointer;
}
.card:hover .pin, .card.pinned .pin{color:var(--ink-soft)}
.pin:hover{background:var(--surface-2); color:var(--ink)}
.card.pinned .pin{color:var(--brass)}

/* search suggestions */
.sug{
  position:absolute; left:0; right:0; top:100%; z-index:30; margin-top:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-lift); overflow:hidden; max-height:60vh; overflow-y:auto;
}
.sug[hidden]{display:none}
.sug-head{
  padding:8px 13px 5px; font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.sug button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink);
  padding:9px 13px; font:400 14px/1.3 "IBM Plex Sans",system-ui,sans-serif;
}
.sug button:hover, .sug button:focus-visible{background:var(--surface-2); outline:none}
.sug .tag{
  flex:none; font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.08em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:3px 7px;
}
.sug .n{margin-left:auto; color:var(--ink-faint); font:400 10px/1 "IBM Plex Mono",monospace}
.sug .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.search-wrap{position:relative; flex:1 1 auto; min-width:0; display:flex}

/* category chooser: an icon on the editor's bottom row, popping a panel that
   both lists what exists and accepts a new name */
.ed-bar{position:relative}
.catpop{
  position:absolute; left:8px; bottom:calc(100% + 6px); z-index:50; width:min(290px, calc(100vw - 32px));
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-lift); overflow:hidden;
}
.catpop[hidden]{display:none}
.catpop input{
  width:100%; border:0; border-bottom:1px solid var(--line); background:none;
  color:var(--ink); padding:11px 13px; outline:none;
  font:500 12px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
}
.catpop input:focus{border-bottom-color:var(--accent)}
.catlist{max-height:240px; overflow-y:auto}
.catlist button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink); padding:8px 13px;
  font:500 11.5px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
  text-transform:uppercase;
}
.catlist button:hover, .catlist button:focus-visible{background:var(--surface-2); outline:none}
.catlist button[aria-pressed="true"]{color:var(--accent)}
.catlist button .n{margin-left:auto; color:var(--ink-faint); text-transform:none}
.catlist .new{color:var(--accent)}
.cat-now{
  font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); padding-left:2px;
}

/* one dropdown shape, used by the identity menu, the people menu and the
   delete confirmation — three popovers that behaved differently would be
   three things to learn */
.anchor{position:relative; display:inline-flex}
.menu{
  position:absolute; z-index:60; min-width:210px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-lift); overflow:hidden; padding:4px 0;
}
.menu[hidden]{display:none}
.menu.below{top:calc(100% + 8px); right:0}
.menu.above{bottom:calc(100% + 8px); left:0}
.menu button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink); padding:9px 14px;
  font:500 12px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
}
.menu button:hover, .menu button:focus-visible{background:var(--surface-2); outline:none}
.menu button[aria-pressed="true"]{color:var(--accent)}
.menu button .n{margin-left:auto; color:var(--ink-faint)}
.menu .sep{height:1px; background:var(--line); margin:4px 0}
.menu .head{
  padding:8px 14px 4px; font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.menu .danger{color:var(--brass)}
.menu input{
  width:100%; border:0; border-bottom:1px solid var(--line); background:none;
  color:var(--ink); padding:10px 14px; outline:none; margin-bottom:4px;
  font:500 12px/1.3 "IBM Plex Mono",ui-monospace,monospace;
}

/* ---------- phone ----------
   The chip row and the Mine/Ours/All control are desktop furniture: on a
   390px screen they eat a third of the first card. Keep's answer is a drawer,
   and that is the right one — every filter moves there, the wall gets the
   whole screen, and the actions you actually use at the store (archive, bin,
   pin) move onto the card itself as gestures. */
.hamburger{
  flex:none; display:none; width:38px; height:38px; place-items:center;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  color:var(--ink-soft); cursor:pointer; box-shadow:var(--shadow);
}
.scrim-left{
  position:fixed; inset:0; z-index:45; background:#0b100f80; display:none;
  -webkit-backdrop-filter:blur(1px); backdrop-filter:blur(1px);
}
.scrim-left.open{display:block}
.drawer{
  position:fixed; top:0; bottom:0; left:0; z-index:46; width:min(300px, 84vw);
  background:var(--surface); border-right:1px solid var(--line);
  box-shadow:6px 0 28px #0000002e; overflow-y:auto; padding:14px 0 24px;
  transform:translateX(-102%); transition:transform .18s ease;
}
.drawer.open{transform:translateX(0)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer h2{
  margin:0; padding:10px 18px 6px;
  font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
}
.drawer button{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink);
  padding:11px 18px; font:500 13px/1.3 Archivo,system-ui,sans-serif;
}
.drawer button:hover, .drawer button:focus-visible{background:var(--surface-2); outline:none}
.drawer button[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent)}
.drawer button .n{margin-left:auto; color:var(--ink-faint); font:400 11px/1 "IBM Plex Mono",monospace}
.drawer .sep{height:1px; background:var(--line); margin:8px 0}
.drawer svg{flex:none}

/* drag to reorder, pinned only */
.card.lifted{
  box-shadow:0 10px 26px #00000038, 0 0 0 2px var(--brass);
  transform:scale(1.03); opacity:.97; position:relative; z-index:5;
}
.swipe.lifting{touch-action:none}
.swipe.ghost .card{opacity:.28}

/* selection mode — long press to enter, then tap to add, like Keep */
.selbar{
  position:absolute; inset:0; z-index:22; display:flex; align-items:center; gap:4px;
  background:var(--ground); padding:10px 14px 0;
}
.selbar[hidden]{display:none}
.selcount{
  font:600 14px/1 Archivo,system-ui,sans-serif; color:var(--ink);
  margin-right:6px; min-width:84px;
}
.selbar .sp{flex:1}
.card.sel{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift)}
.card .tick{
  position:absolute; top:8px; left:8px; width:21px; height:21px; border-radius:999px;
  background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
  box-shadow:0 0 0 2px var(--surface);
}
body.selecting .card{cursor:pointer}
body.selecting .pin{display:none}

/* swipe + pull-to-refresh */
.swipe{position:relative; overflow:hidden; border-radius:var(--r)}
.swipe-bg{
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:space-between; padding:0 22px; border-radius:var(--r);
  color:#fff; opacity:0;
}
.swipe-bg.arch{background:var(--accent)}
.swipe-bg.del{background:#9a3412}
.swipe.armed .card{box-shadow:var(--shadow-lift)}
.swipe.armed .swipe-bg{font-weight:700}
/* latched: the card sits open where you left it and the exposed track is the
   button that confirms. Only delete latches — archive acts on release. */
.swipe.latched .swipe-bg{opacity:1}
.swipe.latched .card{box-shadow:var(--shadow-lift)}
.conf{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 15px; border-radius:999px;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.65);
  font:700 12px/1 Archivo,system-ui,sans-serif; letter-spacing:.07em;
  text-transform:uppercase; white-space:nowrap; cursor:pointer;
}
.conf:active{background:rgba(255,255,255,.34)}
.swipe .card{position:relative; z-index:1; transition:transform .16s ease}
.swipe.dragging .card{transition:none}
.ptr{
  position:fixed; left:50%; top:4px; z-index:25; transform:translate(-50%, -48px);
  width:34px; height:34px; border-radius:999px; background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow-lift);
  display:grid; place-items:center; color:var(--accent); pointer-events:none;
}
.ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ptr.spin svg{animation:none}}

@media (max-width:700px){
  .hamburger{display:grid}
  .filters{display:none}            /* chips + view toggles live in the drawer */
  .brand{display:none}              /* the search box gets the width instead */
  main{padding-top:14px}
}

/* view toggles live at the end of the chip row */
.viewchip{
  flex:none; cursor:pointer; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); border-radius:999px; padding:5px 11px; display:inline-flex;
  align-items:center; gap:6px;
  font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
  text-transform:uppercase; white-space:nowrap;
}
.viewchip:hover{border-color:var(--line-strong); color:var(--ink)}
.viewchip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}

/* who is on this device */
.me-btn{
  flex:none; width:30px; height:30px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:600 12px/1 Archivo,system-ui,sans-serif; letter-spacing:.02em;
  display:grid; place-items:center;
}
.me-btn:hover{border-color:var(--accent); color:var(--accent)}
.me-btn.unset{border-style:dashed; color:var(--ink-soft)}
.meta .by{color:var(--brass); text-transform:uppercase; letter-spacing:.08em; font-weight:500}
.meta .shared-mark{display:inline-flex; color:var(--accent)}
.card.shared{box-shadow:var(--shadow), inset 3px 0 0 var(--accent)}
.card.shared.pinned{box-shadow:var(--shadow), inset 3px 0 0 var(--brass)}

/* online / offline */
.net{
  flex:none; display:grid; place-items:center; width:30px; height:30px;
  padding:0; border:0; background:none; cursor:pointer;
  border-radius:999px; color:var(--ink-soft);
}
.net:hover{color:var(--accent)}
.net.off{color:var(--brass); background:var(--brass-wash)}
/* Fixed, and positioned from the button's own rect: an absolute popover here
   would resolve against whichever ancestor happens to be positioned. */
.nettip{
  position:fixed; z-index:70; max-width:min(260px, calc(100vw - 20px));
  background:var(--ink); color:var(--ground); border-radius:9px;
  padding:9px 12px; box-shadow:0 6px 22px #00000040;
  font:400 12px/1.5 "IBM Plex Sans",system-ui,sans-serif;
}
.nettip[hidden]{display:none}
.nettip b{font-weight:600}
.nettip .when{
  display:block; color:#ffffffb0;
  font:400 11px/1.5 "IBM Plex Mono",ui-monospace,monospace;
}
.nettip::before{
  content:""; position:absolute; top:-5px; right:14px; width:10px; height:10px;
  background:var(--ink); transform:rotate(45deg); border-radius:2px;
}
.more-btn{
  display:block; width:100%; margin:4px 0 18px; padding:13px 16px;
  border:1px dashed var(--line-strong); border-radius:var(--r);
  background:none; color:var(--ink-soft); cursor:pointer;
  font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.08em; text-transform:uppercase;
}
.more-btn:hover{border-color:var(--accent); color:var(--accent)}
.empty{
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  font:400 14px/1.6 "IBM Plex Sans",system-ui,sans-serif;
}
.empty code{font:400 13px/1 "IBM Plex Mono",monospace; background:var(--surface-2); padding:2px 5px; border-radius:4px}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:18px; bottom:18px; z-index:30;
  height:52px; padding:0 20px 0 17px; display:flex; align-items:center; gap:9px;
  border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink);
  font:600 14px/1 Archivo,system-ui,sans-serif; cursor:pointer;
  box-shadow:0 5px 16px #16211f33;
}
.fab:hover{filter:brightness(1.07)}

/* ---------- editor: the card, expanded ---------- */
.scrim{
  position:fixed; inset:0; z-index:40; background:#0b100fa6;
  display:flex; align-items:center; justify-content:center;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim[hidden]{display:none}
@media (min-width:700px){.scrim{padding:30px}}
.sheet{
  background:var(--surface); width:100%; height:100%;
  display:flex; flex-direction:column; box-shadow:0 10px 50px #00000059;
}
@media (min-width:700px){
  .sheet{max-width:620px; height:auto; max-height:88vh; border-radius:14px}
}
.ed-top{display:flex; align-items:center; gap:4px; padding:8px 8px 4px; flex:none}
.ed-top input{
  flex:1; min-width:0; border:0; background:none; color:var(--ink);
  font:600 18px/1.35 Archivo,system-ui,sans-serif; outline:none; padding:6px 6px;
}
.ed-top input::placeholder{color:var(--ink-faint)}
.ed-scroll{flex:1; overflow-y:auto; padding:2px 12px 10px; -webkit-overflow-scrolling:touch}

/* uniform editable row */
.row{display:flex; align-items:flex-start; gap:8px; border-radius:7px; padding:1px 2px}
.row:focus-within{background:var(--accent-wash)}
.row .grip{
  flex:none; width:16px; align-self:center; color:var(--ink-faint);
  display:grid; place-items:center; cursor:grab;
}
@media (max-width:700px){.row .grip{display:none}}
.row .it{resize:none; overflow:hidden;
  flex:1; min-width:0; border:0; background:none; color:var(--ink); outline:none;
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif; padding:4px 0;
}
.row.note .it{color:var(--ink-soft); font-style:italic}
.row.done .it{color:var(--ink-soft); text-decoration:line-through}
.row.sec .it{
  font:600 11px/1.5 Archivo,system-ui,sans-serif; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-soft); padding-top:12px;
}
.row .x{
  flex:none; width:26px; height:26px; align-self:center; padding:0; border:0;
  background:none; color:var(--ink-faint); border-radius:6px; cursor:pointer;
  display:grid; place-items:center; opacity:0;
}
.row:hover .x, .row:focus-within .x{opacity:1}
@media (pointer:coarse){.row .x{opacity:.55}}
.row .x:hover{background:var(--surface-2); color:var(--ink)}
.row .box{margin-top:7px}

.add{
  display:flex; align-items:center; gap:8px; padding:5px 2px; margin-left:24px;
  background:none; border:0; cursor:pointer; color:var(--ink-soft);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif; width:calc(100% - 24px);
  text-align:left; border-radius:7px;
}
.add:hover{color:var(--ink); background:var(--surface-2)}
.ed-raw{
  width:100%; min-height:300px; resize:vertical; border:1px solid var(--line);
  border-radius:8px; background:var(--ground); color:var(--ink); padding:11px 12px;
  outline:none; font:400 13.5px/1.7 "IBM Plex Mono",ui-monospace,monospace; tab-size:2;
}
.ed-raw:focus{border-color:var(--accent)}

/* bottom toolbar */
.ed-bar{
  flex:none; display:flex; align-items:center; gap:2px; padding:7px 9px;
  border-top:1px solid var(--line);
}
.tool{
  width:36px; height:36px; display:grid; place-items:center; padding:0;
  border:0; border-radius:8px; background:none; color:var(--ink-soft); cursor:pointer;
}
.tool:hover{background:var(--surface-2); color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent)}
.tool.brass[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass)}
.tool.share[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent)}
.ed-bar .sp{flex:1}
.saved{
  font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  color:var(--ink-soft); letter-spacing:.04em; padding-right:6px;
}
.ed-bar .cat-now + .saved:not(:empty)::before{content:"·"; margin:0 7px; color:var(--ink-faint)}
.ed-path{
  padding:2px 14px 9px; font:400 10px/1.5 "IBM Plex Mono",ui-monospace,monospace;
  color:var(--ink-faint); overflow-wrap:anywhere; flex:none;
}

/* sign-in */
/* Above everything else it can be opened from: the Users sheet (a .scrim at
   40) and the drawer (46) with its own scrim (45). Two .scrim siblings at the
   same z-index stack by DOM order, and this one is written first, so without
   saying so it opens UNDERNEATH the page that opened it. */
#signinScrim{z-index:55}
.signin{
  background:var(--surface); border-radius:var(--r); width:min(420px, calc(100vw - 28px));
  max-height:calc(100vh - 36px); overflow-y:auto; padding:22px 22px 24px;
  box-shadow:0 14px 60px #00000055;
}
.signin h2{
  margin:0 0 4px; font:600 20px/1.25 "IBM Plex Sans",system-ui,sans-serif; color:var(--ink);
}
.si-sub{
  margin:0 0 18px; color:var(--ink-soft);
  font:400 13px/1.5 "IBM Plex Sans",system-ui,sans-serif;
}
.si-list{display:flex; flex-direction:column; gap:7px}
.si-list button{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  padding:12px 14px; border:1px solid var(--line); border-radius:9px;
  background:var(--ground); color:var(--ink); cursor:pointer;
  font:500 15px/1.2 "IBM Plex Sans",system-ui,sans-serif;
}
.si-list button:hover{border-color:var(--accent); color:var(--accent)}
.si-list button .u{
  margin-left:auto; color:var(--ink-faint);
  font:400 11px/1 "IBM Plex Mono",ui-monospace,monospace;
}
.si-or{
  display:flex; align-items:center; gap:12px; margin:18px 0 14px;
  color:var(--ink-faint); font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.16em; text-transform:uppercase;
}
.si-or::before, .si-or::after{content:""; flex:1; height:1px; background:var(--line)}
.si-or[hidden]{display:none}
.si-form{display:flex; flex-direction:column; gap:13px}
.si-form label{
  display:flex; flex-direction:column; gap:5px; color:var(--ink-soft);
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase;
}
.si-form input{
  padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--ground); color:var(--ink);
  font:400 15px/1.3 "IBM Plex Sans",system-ui,sans-serif; letter-spacing:0;
  text-transform:none;
}
.si-form input:focus{outline:none; border-color:var(--accent)}
.si-form input.bad{border-color:#9a3412}
.si-opt{color:var(--ink-faint); letter-spacing:.08em}
.si-hint{
  color:var(--ink-faint); font:400 10.5px/1.45 "IBM Plex Sans",system-ui,sans-serif;
  letter-spacing:0; text-transform:none;
}
.si-hint.bad{color:#9a3412}
.si-go{
  margin-top:3px; padding:12px; border:0; border-radius:9px;
  background:var(--accent); color:#fff; cursor:pointer;
  font:600 14px/1 "IBM Plex Sans",system-ui,sans-serif;
}
.si-go:disabled{opacity:.45; cursor:default}

/* users */
.users-title{
  flex:1; font:600 15px/1.2 "IBM Plex Sans",system-ui,sans-serif; color:var(--ink);
}
.u-intro{
  padding:4px 2px 16px; color:var(--ink-soft);
  font:400 13px/1.55 "IBM Plex Sans",system-ui,sans-serif; max-width:62ch;
}
.u-person{display:flex; align-items:center; gap:12px; padding:14px 0 6px}
.u-name{
  flex:1; min-width:0; background:none; border:0; border-bottom:1px solid transparent;
  padding:4px 2px; color:var(--ink);
  font:500 15px/1.3 "IBM Plex Sans",system-ui,sans-serif;
}
.u-name:hover{border-bottom-color:var(--line)}
.u-name:focus{outline:none; border-bottom-color:var(--accent)}
.u-slug{
  flex:none; color:var(--ink-faint);
  font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
}
.u-ids{margin:0 0 14px 14px; display:flex; flex-direction:column; gap:2px}
.u-id{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:3px 0;
  font:400 11px/1.5 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft);
}
.u-id .src{
  flex:none; padding:1px 6px; border-radius:4px; background:var(--line);
  color:var(--ink-soft); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
}
/* Source chip and identity share the first line; the dropdown drops to the
   second on a phone. Squeezing them all onto one line broke
   "sam@example.com" into "sam@e / xample. / com", which is worse. */
.idline{display:flex; align-items:center; gap:9px; flex:1 1 100%; min-width:0}
.u-id .who{overflow-wrap:anywhere}
.u-id select{margin-left:auto}
.u-detach{
  margin-left:auto; padding:2px 8px; border:1px solid var(--line); border-radius:6px;
  background:none; color:var(--ink-faint); cursor:pointer;
  font:400 10px/1.6 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
}
.u-detach:hover{border-color:#9a3412; color:#9a3412}
.u-id.muted{color:var(--ink-faint); font-style:italic}
.u-slug.since{margin-left:auto; padding-left:10px}
@media (min-width:560px){
  .idline{flex:1 1 auto}
  .u-id select{margin-left:0}
}
.u-id select{
  background:none; border:1px solid var(--line); border-radius:6px;
  color:var(--ink-soft); padding:2px 5px; font:inherit; font-size:10.5px;
}
.u-card{border-top:1px solid var(--line)}
/* An email is short enough to share its line with the remove button; only a
   long opaque sign-in ever needed a line of its own. */
.u-card .u-id .idline{flex:1 1 auto}
.u-card:first-of-type{border-top:0}
.u-add, .u-addmail{
  background:none; border:1px dashed var(--line-strong); border-radius:7px;
  color:var(--ink-soft); cursor:pointer; padding:7px 12px;
  font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.06em;
}
.u-add{margin-top:18px; width:100%; padding:11px}
.u-addmail{align-self:flex-start; margin-top:4px; border-style:dashed; font-size:10px}
.u-add:hover, .u-addmail:hover{border-color:var(--accent); color:var(--accent)}

/* undo toast */
.toast{
  position:fixed; left:16px; bottom:18px; z-index:60; display:flex; align-items:center; gap:14px;
  background:var(--ink); color:var(--ground); border-radius:9px; padding:11px 12px 11px 15px;
  box-shadow:0 6px 22px #00000040;
  font:400 13px/1 "IBM Plex Sans",system-ui,sans-serif;
}
.toast[hidden]{display:none}
.toast button{
  border:0; background:none; color:var(--accent); cursor:pointer;
  font:600 13px/1 Archivo,system-ui,sans-serif; letter-spacing:.04em; text-transform:uppercase;
}

</style>
</head>
<body>

<div class="bar">
  <div class="bar-row">
    <button class="hamburger" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">Notes <span class="count" id="count"></span></div>
    <div class="search-wrap">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search notes and categories" aria-label="Search notes and categories"
               autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sug"
               title="Type words to search, or cat:woodgas to filter to a category">
      </label>
      <div class="sug" id="sug" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <button class="net" id="net" type="button" aria-haspopup="true" aria-expanded="false"
            title="Sync status" aria-label="Sync status"></button>
    <div class="nettip" id="netTip" role="status" hidden></div>
    <span class="anchor">
      <button class="me-btn unset" id="meBtn" aria-haspopup="true" aria-expanded="false" title="Who's using this device?" aria-label="Who's using this device?">?</button>
      <div class="menu below" id="meMenu" hidden></div>
    </span>
  </div>
  <div class="filters">
    <div class="seg" id="who" role="group" aria-label="Whose notes"></div>
    <div class="chips" id="chips"></div>
    <button class="viewchip" id="archBtn" aria-pressed="false" title="Show archive" aria-label="Show archive">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h18v3H3zM5 10v10h14V10M9.5 14h5"/></svg>Archive</button>
    <button class="viewchip" id="trashBtn" aria-pressed="false" title="Show deleted notes" aria-label="Show deleted notes">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>Trash</button>
  </div>
  <div class="selbar" id="selbar" hidden>
    <button class="iconbtn" id="selClose" aria-label="Leave selection">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <span class="selcount" id="selCount"></span>
    <span class="sp"></span>
    <button class="iconbtn" id="selPin" aria-label="Pin or unpin" title="Pin / unpin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M7 4h10l-1.5 7 2.5 3H5.5L8 11z"/></svg>
    </button>
    <button class="iconbtn" id="selShare" aria-label="Add to Ours" title="Add to Ours">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0M18 7v6M21 10h-6"/></svg>
    </button>
    <button class="iconbtn" id="selArch" aria-label="Archive" title="Archive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h18v3H3zM5 10v10h14V10M9.5 14h5"/></svg>
    </button>
    <button class="iconbtn" id="selDel" aria-label="Delete" title="Delete">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
    </button>
  </div>
</div>

<div class="scrim-left" id="drawerScrim"></div>
<nav class="drawer" id="drawer" aria-label="Filters"></nav>
<div class="ptr" id="ptr" hidden>
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3.3-6.9"/><path d="M21 4v5h-5"/></svg>
</div>

<main>
  <div id="wall"></div>
</main>


<button class="fab" id="newBtn">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  New note
</button>

<div class="scrim" id="signinScrim" hidden>
  <div class="signin" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
    <h2 id="signinTitle">Who are you?</h2>
    <p class="si-sub" id="signinSub"></p>
    <div class="si-list" id="signinList"></div>
    <div class="si-or" id="signinOr"><span>or</span></div>
    <form class="si-form" id="signinForm">
      <label>Username
        <input id="suUser" autocomplete="username" autocapitalize="none"
               spellcheck="false" maxlength="32" placeholder="shortname">
        <span class="si-hint" id="suHint">lowercase letters, digits, - and _. This is what notes record, and it does not change.</span>
      </label>
      <label>Display name <span class="si-opt">optional</span>
        <input id="suName" maxlength="60" placeholder="How your name appears">
      </label>
      <label>Email <span class="si-opt">optional</span>
        <input id="suMail" type="email" autocomplete="email" autocapitalize="none"
               spellcheck="false" maxlength="120" placeholder="Used to recognise you when signed in elsewhere">
      </label>
      <button type="submit" class="si-go" id="suGo">Create account</button>
    </form>
  </div>
</div>

<div class="scrim" id="usersScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Users">
    <div class="ed-top">
      <button class="tool" id="usersClose" aria-label="Close" title="Close">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <span class="users-title">Users</span>
    </div>
    <div class="ed-scroll" id="usersBody"></div>
    <div class="ed-path" id="usersPath"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Edit note">
    <div class="ed-top">
      <button class="tool" id="edClose" aria-label="Close and save" title="Close">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <input id="edTitle" placeholder="Title (optional)">
      <button class="tool brass" id="edPin" aria-pressed="false" aria-label="Pin note" title="Pin">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M7 4h10l-1.5 7 2.5 3H5.5L8 11z"/></svg>
      </button>
    </div>
    <div class="ed-scroll" id="edScroll"></div>
    <div class="ed-path" id="edPath"></div>
    <div class="ed-bar">
      <button class="tool" id="edCheck" aria-pressed="false" aria-label="Show checkboxes" title="Show checkboxes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 7.5h7M14 17.5h7"/></svg>
      </button>
      <button class="tool" id="edRaw" aria-pressed="false" aria-label="Show markdown source" title="Markdown source">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 4 12l5 6M15 6l5 6-5 6"/></svg>
      </button>
      <button class="tool brass" id="edArch" aria-pressed="false" aria-label="Archive note" title="Archive">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3H3zM5 10v10h14V10M9.5 14h5"/></svg>
      </button>
      <span class="anchor">
        <button class="tool" id="edDel" aria-haspopup="true" aria-expanded="false" aria-label="Delete note" title="Delete">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
        </button>
        <div class="menu above" id="delMenu" hidden></div>
      </span>
      <button class="tool" id="edCatBtn" aria-label="Category" title="Category" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11V5a2 2 0 0 1 2-2h6l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
      </button>
      <span class="cat-now" id="edCatNow"></span>
      <span class="anchor">
        <button class="tool share" id="edPeopleBtn" aria-haspopup="true" aria-expanded="false" aria-label="Owner and sharing" title="Owner and sharing">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 6.5v7M22.5 10h-7"/></svg>
        </button>
        <div class="menu above" id="peopleMenu" hidden></div>
      </span>
      <span class="sp"></span>
      <span class="cat-now" id="edWhoNow"></span>
      <span class="saved" id="edSaved"></span>
      <div class="catpop" id="catpop" hidden>
        <input id="edCat" placeholder="Type a category, Enter to set" autocomplete="off" spellcheck="false" aria-label="Category">
        <div class="catlist" id="catlistBox"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
  "use strict";
  // ---- state: the server is the state. No localStorage, no client cache to
  // go stale against four other writers of this space (SilverBullet, the
  // daybook, the agent, a git restore). Every mutation is a request; the
  // reply is what we render.
  var NOTES = [], CATS = {}, AUTHORS = {};

  // WHO THIS DEVICE IS, read from the cookie we set — never from the listing
  // response. The service worker caches /api/notes, so a cached body carries
  // whatever "me" was true when it was stored: after a reload the PWA got
  // me:null out of the cache and asked who you were all over again. Identity
  // does not belong in a cacheable body.
  //
  // localStorage is a mirror, not the source: the SERVER reads the cookie when
  // stamping a note, so the cookie has to exist — but if it is evicted while
  // the mirror survives, this puts it back instead of forgetting you.
  function readCookieMe(){
    var m = (document.cookie || "").match(/(?:^|;\s*)notes_who=([^;]*)/);
    var v = m ? decodeURIComponent(m[1]).trim().toLowerCase() : "";
    return /^[a-z][a-z0-9_-]{0,31}$/.test(v) ? v : null;
  }
  function writeCookieMe(v){
    try {
      document.cookie = "notes_who=" + v + "; path=/; max-age=" + (10 * 365 * 24 * 3600) + "; SameSite=Lax";
    } catch (e) {}
    try { localStorage.setItem("notes-who", v); } catch (e) {}
  }
  var ME = readCookieMe();
  if (!ME) {
    var mirror = null;
    try { mirror = localStorage.getItem("notes-who"); } catch (e) {}
    if (mirror && /^[a-z][a-z0-9_-]{0,31}$/.test(mirror)) { writeCookieMe(mirror); ME = mirror; }
  }

  // Whether the shared space shows up in your own feed. Per device, on by
  // default — the point of a shared list is that you see it without asking.
  var SHOW_SHARED = true;
  try {
    var pref = localStorage.getItem("notes-show-shared");
    if (pref !== null) SHOW_SHARED = pref === "1";
  } catch (e) {}

  function api(method, url, body){
    return fetch(url, {
      method: method,
      headers: body ? {"Content-Type":"application/json"} : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      setNet(true);                       // the box answered, whatever it said
      if (!r.ok) {
        return r.json().catch(function(){ return {}; }).then(function(j){
          throw new Error(j.detail || j.error || (r.status + " " + r.statusText));
        });
      }
      return r.json();
    }, function(err){
      setNet(false);                      // transport failed: unreachable
      throw err;
    });
  }

  // The wall is sent previews, not bodies, so the SERVER does the matching --
  // see /api/notes. Searching the preview here would miss hits inside long
  // notes and look like "no results".
  var searchT = null, searchSeq = 0, onlyQueued = false, LOADING = true;

  // in: picks a VIEW, by: picks a SCOPE — neither is text to search for, so
  // both are read here and stripped before the query reaches the server.
  function applyTokens(raw){
    var terms = [], ins = [], bys = [];
    (raw || "").split(/\s+/).forEach(function(t){
      var low = t.toLowerCase();
      if (low.indexOf("in:") === 0 && t.length > 3) ins.push(low.slice(3));
      else if (t) { terms.push(t); if (low.indexOf("by:") === 0) bys.push(low.slice(3)); }
    });

    onlyQueued = false;
    ins.forEach(function(k){
      if (k === "trash") view = "trash";
      else if (k === "archived" || k === "archive") view = "archive";
      else if (k === "shared" || k === "ours") { who = "shared"; view = "wall"; }
      else if (k === "queued" || k === "pending") { onlyQueued = true; view = "wall"; }
    });
    if (!ins.length && (view === "trash" || view === "archive")) view = "wall";

    // Searching for someone's notes while scoped to your own can only ever
    // return nothing, so the scope follows the question being asked.
    if (bys.length) who = (bys.length === 1 && bys[0] === meName()) ? "mine" : "all";

    el.archBtn.setAttribute("aria-pressed", view === "archive" ? "true" : "false");
    el.trashBtn.setAttribute("aria-pressed", view === "trash" ? "true" : "false");
    return terms.join(" ");
  }

  // When the listing last landed. Kept in localStorage too, so after an
  // offline start the tip can say how stale the painted snapshot is instead of
  // claiming the app has never synced.
  var LAST_SYNC = 0;
  try { LAST_SYNC = parseInt(localStorage.getItem("notes_last_sync") || "0", 10) || 0; } catch (e) {}

  function applyListing(d){
    NOTES = d.notes.map(function(n){
      if (view === "trash") n.trashed = true;
      return n;
    });
    if (d.cats) CATS = d.cats;          // full census, never filtered by q
    if (d.people) PEOPLE = d.people;    // slug -> label, for faces and bylines
    if (d.authors) AUTHORS = d.authors;
    shownCount = PAGE;
    render();
  }

  function refresh(){
    var mine = ++searchSeq;
    var sent = applyTokens(q);
    var url = view === "trash"
      ? "/api/trash"
      : "/api/notes?me=" + encodeURIComponent(meName()) + "&scope=" + who + "&shared=" + (SHOW_SHARED ? 1 : 0)
        + (sent ? "&q=" + encodeURIComponent(sent) : "");
    return api("GET", url).then(function(d){
      LOADING = false;
      LAST_SYNC = Date.now();           // the wall and the disk agreed, just now
      try { localStorage.setItem("notes_last_sync", String(LAST_SYNC)); } catch (e) {}
      if (mine !== searchSeq) return;   // a newer keystroke already won
      applyListing(d);
      // Only the plain wall is worth keeping: a snapshot of a search result
      // would open the app next time showing someone's old query.
      if (!q && view === "wall") snapSave(d);
    });
  }

  function search(){
    clearTimeout(searchT);
    searchT = setTimeout(function(){
      refresh().catch(function(e){ fail("Search failed", e); });
    }, 160);
  }

  // One note's real body, for the editor and for any write that rewrites it.
  function fullBody(id){
    return api("GET", "/api/note?id=" + encodeURIComponent(id)).then(function(n){ return n.body; });
  }

  function fail(what, e){
    console.error(what, e);
    toast(what + " — " + ((e && e.message) || "unknown error"), null);
  }

  // Optimistic: apply locally, then persist. On failure say so and reload the
  // truth rather than leaving the screen disagreeing with the disk.
  function persist(n, patch, what){
    var before = {};
    for (var k in patch) { before[k] = n[k]; n[k] = patch[k]; }
    render();
    var req = {id:n.id};
    for (var k2 in patch) req[k2] = patch[k2];
    return api("PUT", "/api/notes", req).then(function(saved){
      for (var k3 in saved) n[k3] = saved[k3];
      render();
      return saved;
    }).catch(function(e){
      for (var k4 in before) n[k4] = before[k4];
      fail(what, e); refresh();
      throw e;
    });
  }

  // Default to the owner's own notes. The agent has written into this space for
  // months, and on first open the wall was almost entirely agent pages — the
  // actual notes were buried (decided 2026-11-09).
  // "wall" | "archive" | "trash". Trash is a real view because delete has
 // always MOVED a note rather than unlinking it — that only helps if there is
 // a way to get it back without an agent and a shell (2026-11-09: the owner
 // deleted a note by accident and could not).
  var q = "", view = "wall", openId = null, who = "mine";
  function showArchive(){ return view === "archive"; }
  var el = {
    q:document.getElementById("q"), chips:document.getElementById("chips"),
    who:document.getElementById("who"), sug:document.getElementById("sug"),
    meBtn:document.getElementById("meBtn"),
    edCat:document.getElementById("edCat"), catpop:document.getElementById("catpop"),
    edCatBtn:document.getElementById("edCatBtn"), edCatNow:document.getElementById("edCatNow"),
    catlistBox:document.getElementById("catlistBox"), net:document.getElementById("net"),
    edPeopleBtn:document.getElementById("edPeopleBtn"), peopleMenu:document.getElementById("peopleMenu"),
    delMenu:document.getElementById("delMenu"), meMenu:document.getElementById("meMenu"),
    trashBtn:document.getElementById("trashBtn"), edWhoNow:document.getElementById("edWhoNow"),
    menuBtn:document.getElementById("menuBtn"), drawer:document.getElementById("drawer"),
    selbar:document.getElementById("selbar"), selCount:document.getElementById("selCount"),
    selClose:document.getElementById("selClose"), selPin:document.getElementById("selPin"),
    selArch:document.getElementById("selArch"), selDel:document.getElementById("selDel"),
    selShare:document.getElementById("selShare"),
    drawerScrim:document.getElementById("drawerScrim"), ptr:document.getElementById("ptr"),
    wall:document.getElementById("wall"), count:document.getElementById("count"),
    archBtn:document.getElementById("archBtn"), scrim:document.getElementById("scrim"),
    edClose:document.getElementById("edClose"), edTitle:document.getElementById("edTitle"),
    edPin:document.getElementById("edPin"), edScroll:document.getElementById("edScroll"),
    edPath:document.getElementById("edPath"), edCheck:document.getElementById("edCheck"),
    edRaw:document.getElementById("edRaw"), edArch:document.getElementById("edArch"),
    edDel:document.getElementById("edDel"), edSaved:document.getElementById("edSaved"),
    netTip:document.getElementById("netTip"),
    signinScrim:document.getElementById("signinScrim"), signinList:document.getElementById("signinList"),
    signinSub:document.getElementById("signinSub"), signinTitle:document.getElementById("signinTitle"),
    signinOr:document.getElementById("signinOr"),
    signinForm:document.getElementById("signinForm"), suUser:document.getElementById("suUser"),
    suName:document.getElementById("suName"), suMail:document.getElementById("suMail"),
    suGo:document.getElementById("suGo"), suHint:document.getElementById("suHint"),
    usersScrim:document.getElementById("usersScrim"), usersBody:document.getElementById("usersBody"),
    usersClose:document.getElementById("usersClose"), usersPath:document.getElementById("usersPath"),
    toast:document.getElementById("toast"), toastMsg:document.getElementById("toastMsg"),
    toastUndo:document.getElementById("toastUndo"), newBtn:document.getElementById("newBtn")
  };
  el.q.placeholder = "Search notes";

  function matches(n){
    if (!inScope(n, who)) return false;
    if (onlyQueued) return !!n.pending;
    if (view === "trash") return true;        // the trash view IS its own list
    if (archivedForMe(n) !== showArchive()) return false;
    return true;   // text AND category matching happen server-side
  }

  var INL = /\*\*([^*]+)\*\*|`([^`]+)`|\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]|\[([^\]]+)\]\(([^)]+)\)/g;
  function inline(text, parent){
    var last = 0, m;
    INL.lastIndex = 0;
    while ((m = INL.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) parent.appendChild(node("strong", null, m[1]));
      else if (m[2] !== undefined) parent.appendChild(node("code", null, m[2]));
      else if (m[3] !== undefined) parent.appendChild(document.createTextNode(m[4] !== undefined ? m[4] : m[3]));
      else parent.appendChild(document.createTextNode(m[5]));
      last = INL.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
    return parent;
  }

  // ---- search term highlighting ----
  // Runs over a finished subtree rather than during construction, so it
  // composes with the markdown renderer: bold, code and link text all get
  // highlighted without inline() needing to know about search at all.
  function terms(){
    // cat: tokens are filters, not text to look for — highlighting them would
    // paint nothing and look broken.
    var t = (q || "").toLowerCase().split(/\s+/).filter(function(x){
      return x && x.indexOf("cat:") !== 0;
    });
    // longest first, so "food lion" marks the longer run before its pieces
    return t.sort(function(a, b){ return b.length - a.length; });
  }

  function highlight(root){
    var ts = terms();
    if (!ts.length || !root) return root;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var texts = [], n;
    while ((n = walker.nextNode())) texts.push(n);
    texts.forEach(function(tn){
      var s = tn.nodeValue, low = s.toLowerCase(), out = null, i = 0;
      while (i < s.length) {
        var at = -1, len = 0;
        for (var k = 0; k < ts.length; k++) {
          var p = low.indexOf(ts[k], i);
          if (p >= 0 && (at < 0 || p < at || (p === at && ts[k].length > len))) { at = p; len = ts[k].length; }
        }
        if (at < 0) break;
        out = out || document.createDocumentFragment();
        if (at > i) out.appendChild(document.createTextNode(s.slice(i, at)));
        var m = document.createElement("mark");
        m.textContent = s.slice(at, at + len);
        out.appendChild(m);
        i = at + len;
      }
      if (out) {
        if (i < s.length) out.appendChild(document.createTextNode(s.slice(i)));
        tn.parentNode.replaceChild(out, tn);
      }
    });
    return root;
  }

  function node(tag, cls, text){
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  // --- markdown-lite preview: checkboxes, bullets, headings, prose ---
  function renderBody(n, box){
    var lines = (n.preview !== undefined ? n.preview : n.body).split("\n"), para = [], nLines = 0;
    function flush(){
      if (!para.length) return;
      box.appendChild(inline(para.join("\n"), node("p", null)));
      para = [];
    }
    lines.forEach(function(line, i){
      var m;
      if (/^\s*$/.test(line)) { flush(); return; }
      nLines++;
      if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s*(.*)$/))) {
        flush();
        var done = m[1].toLowerCase() === "x";
        var row = node("div", "ck" + (done ? " done" : ""));
        var b = node("button", "box" + (done ? " on" : ""));
        b.setAttribute("aria-label", (done ? "Uncheck " : "Check ") + m[2]);
        b.innerHTML = done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 13 4.5 4.5L19 7"/></svg>' : "";
        b.addEventListener("click", function(ev){ ev.stopPropagation(); toggleCheck(n, i); });
        row.appendChild(b); row.appendChild(inline(m[2], node("span", null)));
        box.appendChild(row);
      } else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flush();
        var li = node("div", "li");
        li.appendChild(inline(m[1], node("span", null)));
        box.appendChild(li);
      } else if ((m = line.match(/^#{1,4}\s+(.*)$/))) {
        flush(); box.appendChild(inline(m[1], node("div", "h")));
      } else {
        para.push(line.replace(/^\s*\*(.+)\*\s*$/, "$1"));
      }
    });
    flush();
    return nLines;
  }

  // A card shows a PREVIEW. Toggling from the card must rewrite the whole
  // file, so fetch the real body first -- writing back the preview would
  // silently truncate the note to its first 700 characters.
  // The preview starts at byte 0, so the line index is the same in both.
  function toggleCheck(n, idx){
    fullBody(n.id).then(function(body){
      var lines = body.split("\n");
      if (!/\[([ xX])\]/.test(lines[idx] || "")) throw new Error("that line moved — reopen the note");
      lines[idx] = lines[idx].replace(/\[([ xX])\]/, function(_, c){ return c.toLowerCase() === "x" ? "[ ]" : "[x]"; });
      return api("PUT", "/api/notes", {id:n.id, body:lines.join("\n")});
    }).then(function(saved){
      for (var k in saved) n[k] = saved[k];
      render();
    }).catch(function(e){ fail("Couldn't tick that off", e); refresh(); });
  }

  function card(n){
    var c = node("div", "card" + (n.shared ? " shared" : "") + (pinnedForMe(n) ? " pinned" : "") + (n.pending ? " pending" : "") + (SEL[n.id] ? " sel" : ""));
    if (SEL[n.id]) {
      var tick = node("div", "tick");
      tick.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 13 4.5 4.5L19 7"/></svg>';
      c.appendChild(tick);
    }
    c.tabIndex = 0;
    // An untitled note shows no heading at all — an empty h3 would leave a
    // gap where a title would be, which reads as a rendering fault.
    if (n.title) c.appendChild(highlight(node("h3", null, n.title)));
    else c.classList.add("untitled");

    var pin = node("button", "pin");
    pin.setAttribute("aria-label", (pinnedForMe(n) ? "Unpin " : "Pin ") + (n.title || "note"));
    pin.setAttribute("title", pinnedForMe(n) ? "Unpin" : "Pin");
    pin.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (pinnedForMe(n) ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 17v5M7 4h10l-1.5 7 2.5 3H5.5L8 11z"/></svg>';
    pin.addEventListener("click", function(ev){ ev.stopPropagation(); persist(n, {pinned:!pinnedForMe(n)}, "Couldn't pin that").catch(function(){}); });
    c.appendChild(pin);

    var box = node("div", "body");
    var nLines = renderBody(n, box);
    highlight(box);
    c.appendChild(box);

    var meta = node("div", "meta");
    meta.appendChild(node("span", "cat", n.pending ? "queued" : n.cat));
    // Say who wrote it only when that is not you — otherwise every card on
    // your own wall carries your own name, which is noise.
    if (!n.pending && n.author !== meName()) meta.appendChild(node("span", "by", nameOf(n.author)));
    if (n.shared) {
      var sh = node("span", "shared-mark");
      sh.setAttribute("title", "In the shared space");
      sh.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0M18 7v6M21 10h-6"/></svg>';
      meta.appendChild(sh);
    }
    meta.appendChild(node("span", "sp"));
    meta.appendChild(node("span", "yr", n.date));
    c.appendChild(meta);

    function act(){
      if (selMode) { toggleSel(n.id); return; }
      if (n.pending) { toast("Queued — this note saves when the box is reachable", null); return; }
      if (n.trashed) { restoreNote(n); return; }
      open(n.id);
    }
    c.addEventListener("click", act);
    c.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); } });

    // Truncation marker decided from the CONTENT, not from layout. This used
    // to be a per-card requestAnimationFrame that read scrollHeight and then
    // inserted a node -- read, write, read, write, 545 times -- which is
    // layout thrash and was a large part of why the wall felt slow.
    if (n.truncated || nLines > CLIP_LINES) {
      box.classList.add("clipped");
      c.insertBefore(node("div", "more", n.lines + " lines — tap to open"), meta);
    }
    return c;
  }

  // ---- back dismisses a layer, not the app ----
  // In a PWA the system back gesture is the only "back" there is, and without
  // this it closes the whole app from inside an open note. Each thing that
  // covers the wall pushes one history entry and takes it back when it closes,
  // so back means "close this" exactly once.
  var LAYER = null;
  function enterLayer(kind){
    if (LAYER === kind) return;
    LAYER = kind;
    try { history.pushState({notesLayer: kind}, ""); } catch (e) {}
  }
  function exitLayer(){
    if (!LAYER) return;
    LAYER = null;
    try { history.back(); } catch (e) {}
  }
  window.addEventListener("popstate", function(){
    if (!LAYER) return;                 // not one of ours; let it be
    var k = LAYER; LAYER = null;
    if (k === "note") close(true);
    else if (k === "users") closeUsers(true);
    else if (k === "signin") closeSignIn(true);
    else if (k === "drawer") closeDrawer(true);
    else if (k === "sel") exitSel(true);
  });

  // ---- selection mode ----
  // Long press enters it and tap adds, which is how Keep does it — and it is
  // the only way to act on twenty notes without opening twenty notes.
  var SEL = {}, selMode = false;
  function selCount(){ return Object.keys(SEL).length; }

  function enterSel(id){
    selMode = true; SEL = {}; SEL[id] = 1;
    document.body.classList.add("selecting");
    enterLayer("sel");
    render();
  }
  function exitSel(fromHistory){
    selMode = false; SEL = {};
    document.body.classList.remove("selecting");
    if (!fromHistory) exitLayer();
    render();
  }
  function toggleSel(id){
    if (SEL[id]) delete SEL[id]; else SEL[id] = 1;
    if (!selCount()) { exitSel(); return; }
    render();
  }
  function selected(){
    return NOTES.filter(function(n){ return SEL[n.id]; });
  }
  function drawSel(){
    el.selbar.hidden = !selMode;
    if (!selMode) return;
    var n = selCount();
    el.selCount.textContent = n + " selected";
    var any = selected();
    var allPinned = any.length && any.every(pinnedForMe);
    el.selPin.setAttribute("aria-pressed", allPinned ? "true" : "false");
    el.selPin.title = allPinned ? "Unpin" : "Pin";
  }

  // One request per note, in order, then a single refresh — a bulk endpoint
  // would be faster and would also need its own partial-failure story.
  function bulk(patch, label, undoPatch){
    var items = selected();
    if (!items.length) return;
    var done = 0, failed = 0;
    items.reduce(function(chain, x){
      return chain.then(function(){
        return api("PUT", "/api/notes", Object.assign({id: x.id}, patch))
          .then(function(){ done++; }).catch(function(){ failed++; });
      });
    }, Promise.resolve()).then(function(){
      exitSel();
      return refresh();
    }).then(function(){
      if (failed) { fail(label + ": " + failed + " of " + items.length + " failed", new Error("partial")); return; }
      toast(label + " " + done, undoPatch ? function(){
        items.reduce(function(c, x){
          return c.then(function(){
            return api("PUT", "/api/notes", Object.assign({id: x.id}, undoPatch)).catch(function(){});
          });
        }, Promise.resolve()).then(refresh);
      } : null);
    });
  }

  el.selClose.addEventListener("click", function(){ exitSel(); });
  el.selPin.addEventListener("click", function(){
    var any = selected(), allPinned = any.length && any.every(pinnedForMe);
    bulk({pinned: !allPinned}, allPinned ? "Unpinned" : "Pinned", {pinned: allPinned});
  });
  el.selShare.addEventListener("click", function(){
    var any = selected(), allShared = any.length && any.every(function(x){ return x.shared; });
    bulk({shared: !allShared}, allShared ? "Removed from Ours" : "Added to Ours", {shared: allShared});
  });
  el.selArch.addEventListener("click", function(){
    var any = selected(), allArch = any.length && any.every(archivedForMe);
    bulk({archived: !allArch}, allArch ? "Unarchived" : "Archived", {archived: allArch});
  });
  el.selDel.addEventListener("click", function(){
    var items = selected();
    if (!items.length) return;
    var moved = [];
    items.reduce(function(chain, x){
      return chain.then(function(){
        return api("POST", "/api/notes/trash", {id: x.id})
          .then(function(d){ moved.push(d.trashed); }).catch(function(){});
      });
    }, Promise.resolve()).then(function(){
      exitSel(); return refresh();
    }).then(function(){
      toast("Deleted " + moved.length + " — in Trash", function(){
        moved.reduce(function(c, t){
          return c.then(function(){
            return api("POST", "/api/notes/restore", {id: t}).catch(function(){});
          });
        }, Promise.resolve()).then(refresh);
      });
    });
  });

  // ---- gestures: the things you do one-handed in a shop ----
  // Swipe right archives, swipe left bins, long press pins — the Gmail
  // bindings rather than invented ones. The two directions are deliberately
  // NOT symmetric: archive acts the moment you let go, delete does not act
  // until you tap the track. Both leave an undo toast.
  var PRESS_MS = 500, DECIDE_PX = 12;
  // The left fifth of the screen is the drawer's, full stop. A 22px edge strip
  // was too fine a target one-handed: aiming for it and missing swiped the
  // note underneath instead, which is the opposite of what you wanted.
  function drawerZone(){ return Math.max(40, window.innerWidth * 0.20); }
  // Two thirds across the card LATCHES: it stops following your thumb, and it
  // stays there when you release. Nothing slides off the screen on its own.
  var LATCH = 0.66;
  // A fast flick used to put the card at the latch in one frame, so there was
  // no travel to read — it simply appeared there. The card now has a TOP SPEED
  // in px per millisecond and your thumb can outrun it; the animation on
  // release carries the rest at the same rate, so a swipe always looks like a
  // swipe however hard you throw it.
  var MAX_PX_MS = 1.1;
  function glideMs(px){ return Math.max(130, Math.min(380, Math.abs(px) / MAX_PX_MS)); }

  // At most one card sits latched open, and at most one gesture owns a drag.
  // Both are module-level because the DRAWER has to be able to let go of a
  // card: a touch near the edge was being picked up by the card and the drawer
  // at once, so opening the menu archived the note underneath it.
  var LATCHED = null, SWIPING = null;
  function unlatchCard(){ var f = LATCHED; LATCHED = null; if (f) f(); }
  function releaseCard(){ var f = SWIPING; SWIPING = null; if (f) f(); }

  function swipeable(cardEl, n){
    var wrap = node("div", "swipe");
    var bg = node("div", "swipe-bg");
    wrap.appendChild(bg);
    wrap.appendChild(cardEl);
    // Not in the bin (a swipe there has no sensible meaning), and not on a
    // note that has not reached the server yet.
    if (n.pending || n.trashed || !("ontouchstart" in window) || selMode) return wrap;

    var x0 = 0, y0 = 0, decided = false, dragging = false, lp = null, dx = 0;
    var pressX = 0, pressY = 0, armed = false, ignore = true, latched = false;
    var swallow = 0;                      // the tap that cancels must not also open the note
    var lastT = 0;                        // for the speed clamp
    function reset(){
      if (latched) swallow = Date.now() + 500;
      armed = false; latched = false;
      if (SWIPING === reset) SWIPING = null;
      if (LATCHED === reset) LATCHED = null;
      wrap.classList.remove("dragging", "armed", "latched");
      cardEl.style.transition = "transform " + glideMs(dx) + "ms cubic-bezier(.25,.55,.35,1)";
      cardEl.style.transform = ""; bg.style.opacity = 0; bg.textContent = ""; dx = 0;
    }
    function cancelPress(){ if (lp) { clearTimeout(lp); lp = null; } }

    // One place that draws the track, so the latched state cannot drift out of
    // step with the dragging one.
    function paint(right, strength, confirm){
      bg.className = "swipe-bg " + (right ? "arch" : "del");
      bg.textContent = "";
      var lbl;
      if (confirm) {
        lbl = node("span", "conf", "Tap to delete");
      } else {
        lbl = node("span", null, right
          ? (archivedForMe(n) ? "Unarchive" : "Archive") : "Delete");
        lbl.style.cssText = "font:600 12px/1 Archivo,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase";
      }
      if (right) { bg.appendChild(lbl); bg.appendChild(node("span")); }
      else { bg.appendChild(node("span")); bg.appendChild(lbl); }
      bg.style.opacity = strength;
    }

    function doDelete(){
      cardEl.style.transform = "translateX(" + -wrap.offsetWidth + "px)";
      wrap.classList.remove("latched");
      latched = false; if (LATCHED === reset) LATCHED = null;
      api("POST", "/api/notes/trash", {id: n.id}).then(function(d){
        return refresh().then(function(){
          toast("Deleted — it is in Trash", function(){
            api("POST", "/api/notes/restore", {id: d.trashed}).then(refresh)
              .catch(function(e){ fail("Couldn't restore that note", e); });
          });
        });
      }).catch(function(e){ fail("Couldn't delete that note", e); reset(); });
    }

    // The exposed track IS the confirm button. Nothing else on the latched card
    // deletes it, and a tap anywhere else puts it back (see touchstart).
    bg.addEventListener("click", function(ev){
      if (!latched) return;
      ev.stopPropagation();
      doDelete();
    });
    // While a card sits latched, the sliver of it still on screen is not a
    // way into the editor — tapping it cancels, and that tap stops there.
    wrap.addEventListener("click", function(ev){
      if (bg.contains(ev.target)) return;
      if (latched || Date.now() < swallow) { ev.preventDefault(); ev.stopPropagation(); }
    }, true);

    wrap.addEventListener("touchstart", function(ev){
      ignore = true;                      // until this proves to be a card gesture
      if (ev.touches.length !== 1) return;
      // A touch that starts in the drawer zone belongs to the drawer, and while
      // the drawer is open every touch belongs to closing it. Bailing out here
      // is not enough on its own — see releaseCard(), which is what stops a
      // drag that had already started from acting when the menu takes over.
      if (ev.touches[0].clientX <= drawerZone()) return;
      if (el.drawer.classList.contains("open")) return;
      // A latched card is waiting for a verdict: the track confirms (that is
      // the click handler above), anything else cancels.
      if (latched) { if (!bg.contains(ev.target)) reset(); return; }
      unlatchCard();                      // only one card sits open at a time
      ignore = false;
      x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY;
      decided = false; dragging = false; dx = 0;
      lastT = ev.timeStamp || Date.now();
      cardEl.style.transition = "";
      pressX = x0; pressY = y0;
      lp = setTimeout(function(){
        lp = null;
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
        // Keep's model: the hold LIFTS the note. Move from here and you are
        // dragging it; let go without moving and you are selecting it. Only
        // pinned notes can be dragged, so everything else selects at once.
        if (pinnedForMe(n) && view === "wall" && !selMode) { lift(wrap, cardEl, n); }
        else if (selMode) toggleSel(n.id);
        else enterSel(n.id);
      }, PRESS_MS);
    }, {passive: true});

    wrap.addEventListener("touchmove", function(ev){
      if (ignore || DRAG) return;         // not ours / a lifted note is being reordered
      var t = ev.touches[0], ax = t.clientX - x0, ay = t.clientY - y0;
      if (!decided) {
        if (Math.abs(ax) > DECIDE_PX && Math.abs(ax) > Math.abs(ay)) {
          decided = true; dragging = true; cancelPress();
          wrap.classList.add("dragging");
          SWIPING = reset;                // the drawer can take this back
        } else if (Math.abs(ay) > DECIDE_PX) {
          decided = true; cancelPress();        // it is a scroll, let it scroll
        }
        return;
      }
      if (!dragging) return;
      ev.preventDefault();
      var limit = wrap.offsetWidth * LATCH;
      // Follow the thumb up to the latch, then hold. Past it the card stops
      // dead however far you keep going — it can never be flung off-screen.
      var want = Math.abs(ax) <= limit ? ax : (ax > 0 ? limit : -limit);
      // ...and it only ever CLOSES the gap at the top speed, so a flick is
      // still something you can watch rather than a jump cut.
      var now = ev.timeStamp || Date.now();
      var step = MAX_PX_MS * Math.max(1, Math.min(64, now - lastT));
      lastT = now;
      dx = Math.abs(want - dx) <= step ? want : dx + (want > dx ? step : -step);
      // Armed follows your THUMB, not the lagging card: the gesture you made
      // is the one that counts, and the card catches up on release.
      armed = Math.abs(ax) >= limit;
      wrap.classList.toggle("armed", armed);
      cardEl.style.transform = "translateX(" + dx + "px)";
      paint(dx > 0, armed ? 1 : Math.min(0.85, Math.abs(dx) / limit), false);
    }, {passive: false});

    function finish(){
      if (DRAG) return;                   // dragEnd owns this gesture
      cancelPress();
      if (ignore) return;
      if (SWIPING === reset) SWIPING = null;
      if (!dragging) { reset(); return; }
      var go = armed, right = dx > 0;
      wrap.classList.remove("armed", "dragging");
      if (!go) { reset(); return; }       // short of the latch: it springs back
      if (!right) {
        // Delete never completes on the swipe alone. The card stays exactly
        // where the latch stopped it and waits to be confirmed; the undo toast
        // still follows once it is.
        latched = true; LATCHED = reset;
        wrap.classList.add("latched");
        var rest = -wrap.offsetWidth * LATCH;
        cardEl.style.transition = "transform " + glideMs(rest - dx) + "ms cubic-bezier(.25,.55,.35,1)";
        cardEl.style.transform = "translateX(" + rest + "px)";
        paint(false, 1, true);
        return;
      }
      cardEl.style.transition = "transform " + glideMs(wrap.offsetWidth - dx) + "ms cubic-bezier(.3,.5,.4,1)";
      cardEl.style.transform = "translateX(" + wrap.offsetWidth + "px)";
      var was = archivedForMe(n);
      persist(n, {archived: !was}, "Couldn't archive that")
        .then(refresh)
        .then(function(){
          toast(was ? "Unarchived" : "Archived", function(){
            persist(n, {archived: was}, "Couldn't undo that").then(refresh).catch(function(){});
          });
        }).catch(function(){ reset(); });
    }
    wrap.addEventListener("touchend", finish, {passive: true});
    wrap.addEventListener("touchcancel", function(){
      if (ignore) return;
      cancelPress(); reset();
    }, {passive: true});
    return wrap;
  }

  // A latched card is modal in spirit: touch anything else and it goes back.
  if ("ontouchstart" in window) {
    document.addEventListener("touchstart", function(ev){
      if (!LATCHED) return;
      var w = ev.target && ev.target.closest ? ev.target.closest(".swipe.latched") : null;
      if (!w) unlatchCard();
    }, {passive: true});
  }

  // ---- drag a pinned note to reorder it ----
  // Scoped to pinned notes (decided 2026-11-09). That also makes the hard part
  // vanish: the pinned set is small, so a drop RENUMBERS it 10, 20, 30… and
  // writes only the ones whose number actually changed — no fractional
  // indexing, no drift, nothing to rebalance later.
  var DRAG = null;

  function lift(wrap, cardEl, n){
    DRAG = {wrap: wrap, card: cardEl, note: n, moved: false, x0: 0, y0: 0};
    wrap.classList.add("lifting");
    cardEl.classList.add("lifted");
  }

  function pinnedWraps(){
    var sec = el.wall.querySelector(".section");
    return sec ? [].slice.call(sec.querySelectorAll(".swipe")) : [];
  }

  function dragMove(cx, cy){
    if (!DRAG) return;
    DRAG.moved = true;
    DRAG.card.style.transform = "translate(" + (cx - DRAG.x0) + "px," + (cy - DRAG.y0) + "px) scale(1.03)";
    // Where would it land? The first sibling whose centre we are past.
    var wraps = pinnedWraps(), me = wraps.indexOf(DRAG.wrap), target = me;
    for (var i = 0; i < wraps.length; i++) {
      if (wraps[i] === DRAG.wrap) continue;
      var r = wraps[i].getBoundingClientRect();
      if (cy > r.top && cy < r.bottom && cx > r.left && cx < r.right) { target = i; break; }
    }
    DRAG.target = target;
    wraps.forEach(function(w, i){ w.classList.toggle("ghost", i === target && i !== me); });
  }

  function dragEnd(){
    if (!DRAG) return;
    var d = DRAG; DRAG = null;
    d.wrap.classList.remove("lifting");
    d.card.classList.remove("lifted");
    d.card.style.transform = "";
    pinnedWraps().forEach(function(w){ w.classList.remove("ghost"); });

    if (!d.moved) {                       // held and released: that is a select
      if (selMode) toggleSel(d.note.id); else enterSel(d.note.id);
      return;
    }
    if (d.target === undefined) return;

    var pins = NOTES.filter(pinnedForMe).sort(function(a, b){
      var ao = orderForMe(a), bo = orderForMe(b);
      if (ao !== bo) return ao - bo;
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    var from = pins.findIndex(function(x){ return x.id === d.note.id; });
    if (from < 0 || d.target === from) return;
    pins.splice(d.target, 0, pins.splice(from, 1)[0]);

    var writes = [];
    pins.forEach(function(x, i){
      var want = (i + 1) * 10;
      if (orderForMe(x) !== want) {
        x.pin_order = x.pin_order || {};
        x.pin_order[meName()] = want;          // optimistic, for this viewer
        writes.push({id: x.id, order: want});
      }
    });
    render();
    writes.reduce(function(chain, w){
      return chain.then(function(){ return api("PUT", "/api/notes", w).catch(function(){}); });
    }, Promise.resolve()).then(refresh).catch(function(e){ fail("Couldn't reorder", e); refresh(); });
  }

  document.addEventListener("touchmove", function(ev){
    if (!DRAG) return;
    ev.preventDefault();
    dragMove(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive: false});
  document.addEventListener("touchend", function(){ if (DRAG) dragEnd(); }, {passive: true});
  document.addEventListener("touchcancel", function(){ if (DRAG) dragEnd(); }, {passive: true});

  // ---- one gesture owns the drawer: open it, and swipe it away ----
  // Opening from a 22px edge strip meant aiming, and missing it swiped the

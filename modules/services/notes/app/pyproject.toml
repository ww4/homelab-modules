[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes"
version = "0.1.0"
description = "Keep-style card wall over the flat markdown subset of the SilverBullet space"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[project.scripts]
notes = "notes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]
